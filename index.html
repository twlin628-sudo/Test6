<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WAR.SH</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Share+Tech+Mono&display=swap');
:root{
  --bg:#0b0d0f;--panel:#111518;--bdr:#1c2a1c;
  --g:#4dff7c;--g2:#2aaa50;--g3:#0d2a18;
  --r:#ff4444;--r2:#7a1a1a;--b:#44aaff;
  --y:#ffcc44;--y2:#7a6010;
  --fog:#060708;--seen:#0c0f0c;--vis:#0e180f;
  --txt:#8aaa8a;--dim:#3a5a3a;
  --cs:44px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);}
body{font-family:'Rajdhani',sans-serif;display:flex;flex-direction:column;height:100dvh;color:var(--g);user-select:none;}

/* ─ MENU ─ */
#menu{display:flex;flex-direction:column;align-items:center;justify-content:center;
  flex:1;gap:18px;padding:32px;
  background:radial-gradient(ellipse at 50% 40%,#0d2018 0%,var(--bg) 65%);}
.logo{font-family:'Share Tech Mono',monospace;font-size:clamp(2.4rem,11vw,4.5rem);
  color:var(--g);letter-spacing:.05em;animation:glow 2.5s ease-in-out infinite;}
@keyframes glow{0%,100%{text-shadow:0 0 30px #4dff7c55;}50%{text-shadow:0 0 60px #4dff7caa;}}
.logo-sub{font-size:12px;color:var(--dim);letter-spacing:.4em;margin-top:-12px;}
.mbtn{width:100%;max-width:300px;padding:15px 20px;background:transparent;
  border:1px solid var(--g2);color:var(--g);font-family:'Rajdhani';font-size:16px;
  font-weight:700;letter-spacing:.1em;cursor:pointer;position:relative;text-align:left;}
.mbtn::after{content:'▶';position:absolute;right:16px;color:var(--g2);font-size:11px;}
.mbtn:active{background:var(--g3);}
.mbtn.pri{border-color:var(--g);}

/* ─ PEER OVERLAY ─ */
#peer-ovl{display:none;position:fixed;inset:0;background:#000c;z-index:200;
  align-items:center;justify-content:center;}
#peer-ovl.show{display:flex;}
#peer-box{background:var(--panel);border:1px solid var(--g2);padding:24px 20px;
  width:90%;max-width:320px;display:flex;flex-direction:column;gap:12px;align-items:center;}
#peer-box h3{font-family:'Share Tech Mono';font-size:.95rem;color:var(--g);text-align:center;letter-spacing:.1em;}
#peer-room-code{font-size:0.85rem;letter-spacing:.08em;color:var(--y);font-family:'Share Tech Mono';
  text-align:center;padding:8px;word-break:break-all;background:var(--g3);width:100%;}
#peer-input{background:var(--g3);border:1px solid var(--g2);color:var(--g);
  padding:10px;font-family:'Share Tech Mono';font-size:1.6rem;letter-spacing:.25em;
  width:100%;text-align:center;outline:none;}
#peer-msg{font-size:12px;color:var(--txt);text-align:center;line-height:1.5;}
.pbtn{padding:11px 28px;background:var(--g3);border:1px solid var(--g);color:var(--g);
  font-family:'Rajdhani';font-size:15px;font-weight:700;cursor:pointer;width:100%;}
.pbtn.dim{border-color:var(--dim);color:var(--dim);background:transparent;}

/* ─ GAME ─ */
#game{display:none;flex-direction:column;height:100dvh;}

/* HUD */
#hud{display:flex;align-items:center;background:var(--panel);
  border-bottom:1px solid var(--bdr);flex-shrink:0;height:40px;padding:0 8px;}
.hr{display:flex;align-items:center;gap:4px;padding:0 8px;
  border-right:1px solid var(--bdr);height:100%;font-size:14px;font-weight:700;}
.hr-v{color:var(--y);}
.hr-l{color:var(--dim);font-size:11px;}
#h-tick{margin-left:auto;font-family:'Share Tech Mono';font-size:11px;color:var(--dim);}
#speed-btn{margin-left:6px;padding:2px 8px;background:var(--g3);border:1px solid var(--g2);
  color:var(--g);font-size:11px;cursor:pointer;font-family:'Share Tech Mono';}
#menu-btn{margin-left:4px;padding:2px 8px;background:transparent;border:1px solid var(--dim);
  color:var(--dim);font-size:11px;cursor:pointer;font-family:'Share Tech Mono';}

/* MAP AREA */
#map-wrap{flex:1;overflow:hidden;position:relative;background:var(--fog);cursor:default;}
#map-canvas{position:absolute;top:0;left:0;touch-action:none;}

/* CELLS */
.cell{position:absolute;width:var(--cs);height:var(--cs);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;border:1px solid transparent;overflow:hidden;}
.cell.fog{background:var(--fog);}
.cell.seen{background:var(--seen);}
.cell.vis{background:var(--vis);}
/* highlights */
.cell.h-sel{border-color:var(--g)!important;box-shadow:inset 0 0 8px #4dff7c33;}
.cell.h-build{border-color:var(--g2)!important;background:#4dff7c08!important;}
/* coord label */
.clbl{position:absolute;top:1px;left:2px;font-size:7px;color:var(--dim);
  opacity:.5;font-family:'Share Tech Mono';pointer-events:none;}
/* hp bar */
.hpb{position:absolute;bottom:1px;left:2px;right:2px;height:3px;background:#111;border-radius:1px;}
.hpf{height:100%;border-radius:1px;}
.hpf.my{background:var(--g);}
.hpf.en{background:var(--r);}
.hpf.lo{background:var(--y);}
/* drag box for multi-select */
#dragbox{position:absolute;pointer-events:none;
  border:1px dashed var(--g);background:#4dff7c08;display:none;z-index:5;}

/* BOTTOM PANEL */
#bottom{flex-shrink:0;background:var(--panel);border-top:1px solid var(--bdr);
  display:flex;flex-direction:column;min-height:120px;max-height:42vh;}
#info-bar{display:flex;align-items:center;gap:8px;padding:5px 12px;
  border-bottom:1px solid var(--bdr);flex-shrink:0;min-height:32px;}
#i-icon{font-size:17px;}
#i-name{color:var(--g);font-size:13px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;}
#i-hp{color:var(--txt);font-size:11px;white-space:nowrap;}
#i-state{font-size:11px;color:var(--y);margin-left:4px;white-space:nowrap;}
#action-bar{display:flex;flex-wrap:wrap;gap:5px;padding:6px 10px;
  overflow-y:auto;flex:1;align-content:flex-start;}
.ab{padding:7px 12px;background:var(--g3);border:1px solid var(--g2);color:var(--g);
  font-family:'Rajdhani';font-size:14px;font-weight:700;cursor:pointer;
  border-radius:2px;white-space:nowrap;}
.ab:active{background:var(--g2);}
.ab.rd{border-color:var(--r2);color:var(--r);background:#180808;}
.ab.yl{border-color:var(--y2);color:var(--y);background:#181200;}
.ab.off{opacity:.3;pointer-events:none;}
.ab .co{font-size:10px;color:var(--dim);}
.hint{color:var(--dim);font-size:12px;padding:6px 4px;line-height:1.7;align-self:center;}
#logbar{border-top:1px solid var(--bdr);padding:3px 12px;font-family:'Share Tech Mono';
  font-size:11px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;}

/* WIN */
#win-ovl{display:none;position:fixed;inset:0;background:#000c;z-index:300;
  align-items:center;justify-content:center;flex-direction:column;gap:14px;}
#win-ovl.show{display:flex;}
#win-txt{font-family:'Share Tech Mono';font-size:2rem;color:var(--g);text-shadow:0 0 30px var(--g);}
#win-sub{color:var(--txt);font-size:13px;}

@keyframes hit{0%,100%{opacity:1}50%{opacity:.25}}
.cell.hit-fx{animation:hit .18s ease-in-out 2;}
</style>
</head>
<body>

<!-- MENU -->
<div id="menu">
  <div class="logo">WAR.SH</div>
  <div class="logo-sub">點選即時戰略</div>
  <button class="mbtn pri" onclick="startSolo()">單人測試 (AI對手)</button>
  <button class="mbtn" onclick="openPeer('host')">Host — 開房間</button>
  <button class="mbtn" onclick="openPeer('guest')">Guest — 加入房間</button>
</div>

<!-- PEER OVERLAY -->
<div id="peer-ovl">
  <div id="peer-box">
    <h3 id="peer-title">──  ──</h3>
    <div id="peer-room-code" style="display:none"></div>
    <input id="peer-input" maxlength="60" placeholder="貼上 Host 的ID"
      style="display:none" oninput="this.value=this.value.trim()">
    <div id="peer-msg">初始化...</div>
    <button class="pbtn" id="peer-connect-btn" onclick="guestConnect()" style="display:none">連線</button>
    <button class="pbtn dim" onclick="closePeer()">取消</button>
  </div>
</div>

<!-- GAME -->
<div id="game">
  <div id="hud">
    <div class="hr"><span>🪙</span><span class="hr-v" id="h-gold">0</span></div>
    <div class="hr"><span>🌲</span><span class="hr-v" id="h-wood">0</span></div>
    <div class="hr"><span>🍖</span><span class="hr-v" id="h-food">0</span><span class="hr-l">/</span><span class="hr-v" id="h-fmax">10</span></div>
    <div id="h-tick" style="margin-left:auto;font-family:'Share Tech Mono';font-size:11px;color:var(--dim)">T0</div>
    <button id="speed-btn" onclick="cycleSpeed()">1x</button>
    <button id="menu-btn" onclick="goMenu()">離開</button>
  </div>
  <div id="map-wrap">
    <div id="map-canvas"></div>
    <div id="dragbox"></div>
  </div>
  <div id="bottom">
    <div id="info-bar">
      <span id="i-icon">🗺️</span>
      <span id="i-name">點選單位或建築</span>
      <span id="i-hp"></span>
      <span id="i-state"></span>
      <button id="box-btn" onclick="toggleBoxMode()"
        style="margin-left:auto;padding:2px 10px;background:var(--g3);border:1px solid var(--g2);
               color:var(--g);font-family:'Rajdhani';font-size:12px;font-weight:700;
               cursor:pointer;white-space:nowrap;flex-shrink:0;">⬚ 框選</button>
    </div>
    <div id="action-bar"><span class="hint">點我方👷Worker或⚔️士兵開始<br>拖曳可框選多個單位</span></div>
    <div id="logbar">── WAR.SH 開始 ──</div>
  </div>
</div>

<!-- WIN -->
<div id="win-ovl">
  <div id="win-txt"></div>
  <div id="win-sub"></div>
  <button class="pbtn" onclick="goMenu()" style="max-width:200px;margin-top:8px">返回主選單</button>
</div>

<script>
'use strict';
// ════════════════════════════════════
// CONSTANTS
// ════════════════════════════════════
const MW=24, MH=20, CS=44, TICK_MS=1000;
const T={E:0,G:1,W:2,M:3}; // terrain: Empty Gold Wood Mountain
const IC={ // icons
  townhall:'🏰',farm:'🌾',barracks:'⚔️',tower:'🗼',
  worker:'👷',soldier:'🗡️',archer:'🏹',
  e_townhall:'🏯',e_farm:'🌾',e_barracks:'🔴',e_tower:'🗽',
  e_worker:'👺',e_soldier:'👹',e_archer:'👻',
};
const BD={ // building defs
  townhall:{cost:{g:0,w:0},  hp:300,food:10,bt:0 },
  farm:    {cost:{g:60,w:30},hp:80, food:5, bt:8 },
  barracks:{cost:{g:120,w:50},hp:120,food:0,bt:12},
  tower:   {cost:{g:100,w:80},hp:150,food:0,bt:15,atk:6,rng:3},
};
const UD={ // unit defs
  worker: {cost:{g:50}, hp:30, atk:2, rng:1,vis:3,food:0},
  soldier:{cost:{g:80}, hp:80, atk:8, rng:1,vis:2,food:1},
  archer: {cost:{g:100},hp:50, atk:5, rng:3,vis:3,food:1},
};

// ════════════════════════════════════
// GAME STATE
// ════════════════════════════════════
let G={};
let tickTmr=null, speedLv=1, gameMode='solo';

// ─ Selection / Interaction ─
// phase: idle | sel | build_place
// selUnits: [unit,...] (my units currently selected)
// selBldg: building | null
// buildType: string when phase=build_place
let SEL={phase:'idle',selUnits:[],selBldg:null,buildType:null,boxMode:false};

// ─ Pointer state for drag-select vs scroll vs tap ─
let PT={down:false,startX:0,startY:0,startScrX:0,startScrY:0,moved:false,dragging:false};

// ════════════════════════════════════
// FIREBASE SIGNALING + WebRTC DataChannel
// Firebase 只做信令交換，遊戲資料走純 P2P DataChannel
// ════════════════════════════════════
const FB_CONFIG={
  apiKey:"AIzaSyCCshqyIyhQ86R3wZ8zH2kd-hL8vKiEtSU",
  databaseURL:"https://test6-1d148-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"test6-1d148",
};
const ICE_SERVERS=[
  {urls:'stun:stun.l.google.com:19302'},
  {urls:'stun:stun1.l.google.com:19302'},
];

let fbApp=null, fbDb=null;
let rtcConn=null, dataChannel=null;
let peerRole=null, roomId=null, roomRef=null;
let P2cmdQueue=[];

function loadFirebase(cb){
  if(window.firebase){cb();return;}
  el('peer-msg').textContent='載入 Firebase...';
  const urls=[
    'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js',
    'https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js',
  ];
  let n=0;
  urls.forEach(src=>{
    const s=document.createElement('script');
    s.src=src;
    s.onload=()=>{if(++n===urls.length)cb();};
    s.onerror=()=>{el('peer-msg').textContent='❌ Firebase 載入失敗，請確認網路';};
    document.head.appendChild(s);
  });
}

function initFirebase(){
  if(fbApp)return;
  fbApp=firebase.initializeApp(FB_CONFIG);
  fbDb=firebase.database();
}

function makeRoomCode(){
  return Math.random().toString(36).slice(2,8).toUpperCase();
}

function openPeer(role){
  peerRole=role;
  cleanupRTC();
  el('peer-ovl').classList.add('show');
  el('peer-title').textContent=role==='host'?'── HOST 開房間 ──':'── GUEST 加入 ──';
  el('peer-room-code').style.display='none';
  el('peer-input').style.display=role==='guest'?'block':'none';
  el('peer-connect-btn').style.display='none';
  el('peer-msg').textContent='初始化...';
  loadFirebase(()=>{
    initFirebase();
    if(role==='host') hostCreate();
    else {el('peer-msg').textContent='輸入房間碼後按連線';el('peer-connect-btn').style.display='block';}
  });
}

function closePeer(){el('peer-ovl').classList.remove('show');}

async function hostCreate(){
  roomId=makeRoomCode();
  roomRef=fbDb.ref('rooms/'+roomId);
  await roomRef.remove();
  el('peer-room-code').textContent=roomId;
  el('peer-room-code').style.display='block';
  el('peer-msg').textContent='等待對方輸入房間碼...';

  rtcConn=new RTCPeerConnection({iceServers:ICE_SERVERS});
  dataChannel=rtcConn.createDataChannel('game',{ordered:true});
  setupDataChannel(dataChannel);

  const iceCands=[];
  rtcConn.onicecandidate=e=>{if(e.candidate)iceCands.push(e.candidate.toJSON());};
  rtcConn.onicegatheringstatechange=async()=>{
    if(rtcConn.iceGatheringState==='complete'){
      await roomRef.child('offer').set({
        sdp:rtcConn.localDescription.sdp,
        type:rtcConn.localDescription.type,
        ice:JSON.stringify(iceCands),
      });
    }
  };
  const offer=await rtcConn.createOffer();
  await rtcConn.setLocalDescription(offer);

  roomRef.child('answer').on('value',async snap=>{
    if(!snap.val()||rtcConn.remoteDescription)return;
    const a=snap.val();
    await rtcConn.setRemoteDescription({type:a.type,sdp:a.sdp});
    for(const c of JSON.parse(a.ice||'[]'))
      await rtcConn.addIceCandidate(new RTCIceCandidate(c));
    el('peer-msg').textContent='🔗 建立連線中...';
  });
}

function guestConnect(){
  const code=el('peer-input').value.trim().toUpperCase();
  if(code.length<4){alert('請輸入房間碼');return;}
  roomId=code; roomRef=fbDb.ref('rooms/'+roomId);
  el('peer-msg').textContent='讀取房間...';
  el('peer-connect-btn').style.display='none';
  roomRef.child('offer').once('value',async snap=>{
    if(!snap.val()){
      el('peer-msg').textContent='❌ 找不到房間，請確認房間碼';
      el('peer-connect-btn').style.display='block'; return;
    }
    const o=snap.val();
    rtcConn=new RTCPeerConnection({iceServers:ICE_SERVERS});
    rtcConn.ondatachannel=e=>{dataChannel=e.channel;setupDataChannel(dataChannel);};
    const iceCands=[];
    rtcConn.onicecandidate=e=>{if(e.candidate)iceCands.push(e.candidate.toJSON());};
    rtcConn.onicegatheringstatechange=async()=>{
      if(rtcConn.iceGatheringState==='complete'){
        await roomRef.child('answer').set({
          sdp:rtcConn.localDescription.sdp,
          type:rtcConn.localDescription.type,
          ice:JSON.stringify(iceCands),
        });
        el('peer-msg').textContent='🔗 建立連線中...';
      }
    };
    await rtcConn.setRemoteDescription({type:o.type,sdp:o.sdp});
    for(const c of JSON.parse(o.ice||'[]'))
      await rtcConn.addIceCandidate(new RTCIceCandidate(c));
    const answer=await rtcConn.createAnswer();
    await rtcConn.setLocalDescription(answer);
  });
}

function setupDataChannel(ch){
  ch.onopen=()=>{
    el('peer-msg').textContent='✅ 連線成功！';
    if(roomRef)roomRef.remove();
    setTimeout(()=>{
      closePeer();
      if(peerRole==='host') startHost();
      else                  startGuest();
    },600);
  };
  ch.onmessage=e=>onPeerMsg(JSON.parse(e.data));
  ch.onclose=()=>glog('⚠️ 對方斷線');
  ch.onerror=()=>glog('❌ DataChannel 錯誤');
}

function sendRaw(obj){
  if(dataChannel&&dataChannel.readyState==='open')
    dataChannel.send(JSON.stringify(obj));
}

function cleanupRTC(){
  if(dataChannel){try{dataChannel.close();}catch(e){} dataChannel=null;}
  if(rtcConn){try{rtcConn.close();}catch(e){} rtcConn=null;}
  if(roomRef){try{roomRef.remove();}catch(e){} roomRef=null;}
  P2cmdQueue=[];
}

function startHost(){
  gameMode='host';
  initGame(1);
  P2cmdQueue=[];
  clearInterval(tickTmr);
  tickTmr=setInterval(()=>{
    if(G.over){clearInterval(tickTmr);return;}
    P2cmdQueue.splice(0).forEach(cmd=>applyCmd(cmd,2));
    tick();
    sendToGuest();
  },TICK_MS);
  glog('✅ Host 已連線，遊戲開始！');
}

function startGuest(){
  gameMode='guest';
  el('menu').style.display='none';
  el('game').style.display='flex';
  el('speed-btn').style.display='none';
  glog('✅ Guest 已連線，等待遊戲資料...');
}

function sendToGuest(){
  sendRaw({
    t:'state',
    tick:G.tick,over:G.over,winner:G.winner,
    res:G.res,map:G.map,fog:G.fog[1],
    bldgs:G.bldgs.map(b=>({...b})),
    units:G.units.map(u=>({...u})),
    uc:G.uc,bc:G.bc,
  });
}

function sendCmd(cmd){
  if(gameMode==='guest') sendRaw({t:'cmd',cmd});
}

function onPeerMsg(msg){
  if(gameMode==='host'&&msg.t==='cmd'){P2cmdQueue.push(msg.cmd);return;}
  if(msg.t==='state'){
    G.tick=msg.tick;G.over=msg.over;G.winner=msg.winner;
    G.res=msg.res;G.map=msg.map;
    G.fog=[[],msg.fog];
    G.bldgs=msg.bldgs;G.units=msg.units;
    G.uc=msg.uc;G.bc=msg.bc;G.myP=2;
    el('h-tick').textContent='T'+G.tick;
    updateHUD();render();
    if(G.over)showWin();
  }
}

function applyCmd(cmd,owner){
  if(cmd.act==='move'){
    const us=G.units.filter(u=>cmd.unitIds.includes(u.id)&&u.owner===owner);
    assignSpreadMove(us,cmd.tgt[0],cmd.tgt[1]);
  }
  else if(cmd.act==='attack'){
    G.units.filter(u=>cmd.unitIds.includes(u.id)&&u.owner===owner)
      .forEach(u=>{u.act='attack';u.tgt=cmd.tgt;});
  }
  else if(cmd.act==='harvest'){
    G.units.filter(u=>cmd.unitIds.includes(u.id)&&u.owner===owner)
      .forEach(u=>{u.act='harvest';u.tgt=cmd.tgt;});
  }
  else if(cmd.act==='repair'){
    G.units.filter(u=>cmd.unitIds.includes(u.id)&&u.owner===owner)
      .forEach(u=>{u.act='repair';u.tgt=cmd.tgt;});
  }
  else if(cmd.act==='build'){
    const d=BD[cmd.buildType],p=G.res[owner];
    if(p.gold>=d.cost.g&&p.wood>=d.cost.w&&canBuild(cmd.tgt[0],cmd.tgt[1])){
      p.gold-=d.cost.g;p.wood-=d.cost.w;
      addBldg(cmd.buildType,owner,cmd.tgt[0],cmd.tgt[1],true);
      const w=G.units.find(u=>cmd.unitIds.includes(u.id)&&u.type==='worker');
      if(w){w.act='move';w.tgt=cmd.tgt;}
    }
  }
  else if(cmd.act==='train'){
    const b=G.bldgs.find(b=>b.id===cmd.bldgId&&b.owner===owner);
    if(!b)return;
    const p=G.res[owner],cost=UD[cmd.utype].cost.g;
    if(p.gold>=cost&&(cmd.utype==='worker'||p.food<p.foodMax)){
      p.gold-=cost;b.tq.push(cmd.utype);
    }
  }
}

// ════════════════════════════════════
// MULTI — hook into existing actions for Guest
// All action functions check gameMode and send cmd if Guest
// ════════════════════════════════════
function multiMove(units,tx,ty){
  if(gameMode==='guest'){
    sendCmd({act:'move', unitIds:units.map(u=>u.id), tgt:[tx,ty]});
    // Optimistic local preview
    assignSpreadMove(units,tx,ty);
  } else {
    assignSpreadMove(units,tx,ty);
  }
}
function multiAttack(units,tgtId){
  if(gameMode==='guest') sendCmd({act:'attack', unitIds:units.map(u=>u.id), tgt:tgtId});
  units.forEach(u=>{u.act='attack';u.tgt=tgtId;});
}
function multiHarvest(units,pos){
  if(gameMode==='guest') sendCmd({act:'harvest', unitIds:units.map(u=>u.id), tgt:pos});
  units.forEach(u=>{u.act='harvest';u.tgt=pos;});
}
function multiRepair(units,bldgId){
  if(gameMode==='guest') sendCmd({act:'repair', unitIds:units.map(u=>u.id), tgt:bldgId});
  units.forEach(u=>{u.act='repair';u.tgt=bldgId;});
}
function multiBuild(units,buildType,pos){
  const d=BD[buildType]; const p=G.res[G.myP];
  if(p.gold<d.cost.g||p.wood<d.cost.w){glog('❌ 資源不足');return;}
  const w=units.find(u=>u.type==='worker'); if(!w) return;
  if(gameMode==='guest'){
    sendCmd({act:'build', unitIds:units.map(u=>u.id), buildType, tgt:pos});
    // Optimistic deduct locally (will be corrected on next state sync)
    p.gold-=d.cost.g; p.wood-=d.cost.w;
  } else {
    p.gold-=d.cost.g; p.wood-=d.cost.w;
    addBldg(buildType,G.myP,pos[0],pos[1],true);
  }
  w.act='move'; w.tgt=pos;
  glog(`🏗️ 建造 ${buildType} → ${cs(pos[0],pos[1])}`);
  updateHUD();
}
function multiTrain(bldgId,utype){
  const b=G.bldgs.find(b=>b.id===bldgId); if(!b) return;
  const p=G.res[G.myP];
  const cost=UD[utype].cost.g;
  if(p.gold<cost){glog('❌ 金幣不足');return;}
  if(utype!=='worker'&&p.food>=p.foodMax){glog('❌ 食物已滿');return;}
  if(gameMode==='guest'){
    sendCmd({act:'train', bldgId, utype});
    p.gold-=cost; // optimistic
  } else {
    p.gold-=cost; b.tq.push(utype);
  }
  glog(`✅ ${utype} 加入訓練`);
  updateHUD(); showBldgPanel(b);
}

// Override onPeerMsg for Host to queue P2 commands
function onPeerMsg(msg){
  if(gameMode==='host'&&msg.t==='cmd'){
    P2cmdQueue.push(msg.cmd);
    return;
  }
  if(msg.t==='state'){
    G.tick=msg.tick; G.over=msg.over; G.winner=msg.winner;
    G.res=msg.res; G.map=msg.map;
    G.fog=[[],msg.fog]; // index 1 = P2 fog (myP=2, so fog[myP-1]=fog[1])
    G.bldgs=msg.bldgs; G.units=msg.units;
    G.uc=msg.uc; G.bc=msg.bc;
    G.myP=2;
    el('h-tick').textContent='T'+G.tick;
    updateHUD(); render();
    if(G.over) showWin();
  }
}

// ════════════════════════════════════
// INIT
// ════════════════════════════════════
function startSolo(){ gameMode='solo'; initGame(1); }

function initGame(myPlayer){
  document.getElementById('menu').style.display='none';
  document.getElementById('game').style.display='flex';
  speedLv=1; document.getElementById('speed-btn').textContent='1x';
  G={
    tick:0, over:false, winner:null, myP:myPlayer,
    res:{1:{gold:150,wood:100,food:0,foodMax:10},2:{gold:150,wood:100,food:0,foodMax:10}},
    map:[], fog:[[],[]], bldgs:[], units:[],
    uc:{1:{w:0,s:0,a:0},2:{w:0,s:0,a:0}}, bc:1,
  };
  buildMap(); placeStart(); updateFog();
  buildDOM(); updateHUD(); render(); resetSel();
  setTimeout(()=>{
    const wrap=el('map-wrap');
    wrap.scrollLeft=0; wrap.scrollTop=Math.max(0,9*CS-wrap.clientHeight/2);
  },50);
  glog('點選👷Worker → 點💰採金 / 點空地移動 / 點建築建造');
  if(gameMode==='solo'){
    clearInterval(tickTmr);
    tickTmr=setInterval(()=>{tick(1);if(G.over)clearInterval(tickTmr);},TICK_MS);
  }
}

function buildMap(){
  for(let y=0;y<MH;y++){
    G.map.push([]);G.fog[0].push([]);G.fog[1].push([]);
    for(let x=0;x<MW;x++){G.map[y].push(T.E);G.fog[0][y].push('h');G.fog[1][y].push('h');}
  }
  // Mountains
  [[5,5],[6,5],[5,6],[7,8],[8,8],[16,11],[17,11],[16,12],[11,9],[12,9],[11,10]].forEach(([x,y])=>setTile(x,y,T.M));
  // Trees
  [[3,2],[4,3],[3,4],[17,15],[18,16],[17,14],[8,3],[9,4],[14,14],[15,15],[6,9],[7,10],[13,8],[14,9],[10,3],[11,4],[13,16],[14,17]].forEach(([x,y])=>setTile(x,y,T.W));
  // Gold mines
  [[2,2],[20,2],[2,17],[20,17],[11,7],[11,13]].forEach(([x,y])=>setTile(x,y,T.G));
}
function setTile(x,y,t){if(inB(x,y))G.map[y][x]=t;}

function placeStart(){
  addBldg('townhall',1,1,9);  addBldg('townhall',2,22,10);
  addUnit('worker',1,2,9);    addUnit('worker',1,1,10);
  addUnit('worker',2,21,10);  addUnit('worker',2,22,9);
}

function addBldg(type,owner,x,y,underConst=false){
  const d=BD[type];
  const id='b'+G.bc++;
  G.bldgs.push({id,type,owner,x,y,hp:d.hp,mhp:d.hp,
    bp:underConst?0:d.bt, bt:d.bt, uc:underConst, tq:[],tp:0});
  if(d.food&&!underConst) G.res[owner].foodMax+=d.food;
  return id;
}

function addUnit(type,owner,x,y){
  const d=UD[type];
  const pk=type[0]; // w/s/a
  G.uc[owner][pk]++;
  const id=pk+G.uc[owner][pk]+'p'+owner;
  G.units.push({id,type,owner,x,y,hp:d.hp,mhp:d.hp,
    atk:d.atk,rng:d.rng,vis:d.vis,food:d.food,
    act:null,tgt:null}); // act: null|'move'|'harvest'|'attack'
  G.res[owner].food+=d.food;
  return id;
}

// ════════════════════════════════════
// FOG OF WAR
// ════════════════════════════════════
function updateFog(){
  // decay vis→seen
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    if(G.fog[0][y][x]==='v') G.fog[0][y][x]='s';
    if(G.fog[1][y][x]==='v') G.fog[1][y][x]='s';
  }
  // reveal around all entities
  [...G.units,...G.bldgs].forEach(e=>{
    const v=e.vis||(BD[e.type]?.rng?BD[e.type].rng+1:2);
    for(let dy=-v;dy<=v;dy++) for(let dx=-v;dx<=v;dx++){
      const nx=e.x+dx,ny=e.y+dy;
      if(inB(nx,ny)&&Math.abs(dx)+Math.abs(dy)<=v+1)
        G.fog[e.owner-1][ny][nx]='v';
    }
  });
}

function fog1(x,y){return G.fog[(G.myP||1)-1]?.[y]?.[x];} // fog for current player
function canSee(owner,x,y){return G.fog[owner-1]?.[y]?.[x]==='v';}

// ════════════════════════════════════
// BUILD DOM
// ════════════════════════════════════
let CE={}; // cell elements keyed "x,y"

function buildDOM(){
  const canvas=el('map-canvas');
  canvas.innerHTML='';
  canvas.style.width=(MW*CS)+'px';
  canvas.style.height=(MH*CS)+'px';
  CE={};
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    const d=document.createElement('div');
    d.className='cell fog'; d.dataset.x=x; d.dataset.y=y;
    d.style.left=(x*CS)+'px'; d.style.top=(y*CS)+'px';
    d.innerHTML=`<span class="clbl">${cs(x,y)}</span><span class="ci"></span>`+
                `<div class="hpb" style="display:none"><div class="hpf my"></div></div>`;
    CE[`${x},${y}`]=d;
    canvas.appendChild(d);
  }
  setupPointer();
}

// ════════════════════════════════════
// RENDER
// ════════════════════════════════════
function render(){
  // build lookup maps
  const bAt={},uAt={};
  G.bldgs.forEach(b=>{bAt[`${b.x},${b.y}`]=b;});
  G.units.forEach(u=>{const k=`${u.x},${u.y}`;if(!uAt[k])uAt[k]=[];uAt[k].push(u);});

  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    const d=CE[`${x},${y}`];
    const f=fog1(x,y); // h|s|v
    const ci=d.querySelector('.ci');
    const hpb=d.querySelector('.hpb');
    const hpf=d.querySelector('.hpf');

    d.className='cell '+(f==='h'?'fog':f==='s'?'seen':'vis');

    if(f==='h'){ci.textContent='';hpb.style.display='none';continue;}

    // terrain
    const t=G.map[y][x];
    let icon=t===T.G?'💰':t===T.W?'🌲':t===T.M?'🏔️':'';
    let hp=0,mhp=1,isEn=false;

    // building
    const b=bAt[`${x},${y}`];
    if(b&&(f==='v'||b.owner===1)){
      icon=b.uc?'🏗️':(b.owner===2?(IC['e_'+b.type]||'🏯'):(IC[b.type]||'🏠'));
      hp=b.hp;mhp=b.mhp;isEn=b.owner===2;
    }
    // units (top priority, only if visible)
    const us=uAt[`${x},${y}`];
    if(us&&f==='v'){
      const myU=us.find(u=>u.owner===1),enU=us.find(u=>u.owner===2);
      const show=myU||enU;
      if(show){icon=(show.owner===2?(IC['e_'+show.type]||'👾'):(IC[show.type]));hp=show.hp;mhp=show.mhp;isEn=show.owner===2;}
      if(us.length>1) icon+='⁺';
    }

    ci.textContent=icon;
    if(hp>0){
      hpb.style.display='block';
      const pct=Math.max(0,hp/mhp*100);
      hpf.style.width=pct+'%';
      hpf.className='hpf '+(isEn?'en':pct<30?'lo':'my');
    } else hpb.style.display='none';
  }
  applyHighlights();
}

function applyHighlights(){
  Object.values(CE).forEach(d=>d.classList.remove('h-sel','h-build'));
  SEL.selUnits.forEach(u=>CE[`${u.x},${u.y}`]?.classList.add('h-sel'));
  if(SEL.selBldg) CE[`${SEL.selBldg.x},${SEL.selBldg.y}`]?.classList.add('h-sel');
  if(SEL.phase==='build_place'){
    for(let y=0;y<MH;y++) for(let x=0;x<MW;x++)
      if(canBuild(x,y)&&fog1(x,y)!=='h') CE[`${x},${y}`]?.classList.add('h-build');
  }
}

// ════════════════════════════════════
// POINTER HANDLING
// Separate: scroll (1-finger, no unit down) vs drag-select (1-finger, unit down)
// ════════════════════════════════════
function setupPointer(){
  const wrap=el('map-wrap');
  wrap.addEventListener('touchstart', onTS, {passive:false});
  wrap.addEventListener('touchmove',  onTM, {passive:false});
  wrap.addEventListener('touchend',   onTE, {passive:false});
  wrap.addEventListener('mousedown',  onMD);
  wrap.addEventListener('mousemove',  onMM);
  wrap.addEventListener('mouseup',    onMU);
}

function cellAt(cx,cy){
  const wrap=el('map-wrap');
  const r=wrap.getBoundingClientRect();
  const gx=Math.floor((cx-r.left+wrap.scrollLeft)/CS);
  const gy=Math.floor((cy-r.top +wrap.scrollTop )/CS);
  return inB(gx,gy)?{x:gx,y:gy}:null;
}

function ptStart(cx,cy){
  const wrap=el('map-wrap');
  PT.down=true; PT.moved=false; PT.dragging=false; PT.mode=null;
  PT.startX=cx; PT.startY=cy;
  PT.startScrX=wrap.scrollLeft; PT.startScrY=wrap.scrollTop;
}
function ptMove(cx,cy){
  if(!PT.down) return false;
  const dx=cx-PT.startX, dy=cy-PT.startY;
  if(Math.abs(dx)<10&&Math.abs(dy)<10) return false;
  PT.moved=true;
  // Only drag-select when boxMode is explicitly ON; otherwise always scroll
  if(!PT.mode) PT.mode = SEL.boxMode ? 'drag' : 'scroll';
  if(PT.mode==='drag'){ PT.dragging=true; updateDragBox(cx,cy); }
  else { const w=el('map-wrap'); w.scrollLeft=PT.startScrX-dx; w.scrollTop=PT.startScrY-dy; }
  return true;
}
function ptEnd(cx,cy){
  if(!PT.down) return;
  PT.down=false;
  el('dragbox').style.display='none';
  if(PT.dragging) finalizeDrag(cx,cy);
  else if(!PT.moved){ const c=cellAt(cx,cy); if(c) onTap(c.x,c.y); }
  PT.dragging=false; PT.mode=null;
}

function onTS(e){ if(e.touches.length>1){PT.down=false;return;} e.preventDefault(); const t=e.touches[0]; ptStart(t.clientX,t.clientY); }
function onTM(e){ if(!PT.down) return; e.preventDefault(); const t=e.touches[0]; ptMove(t.clientX,t.clientY); }
function onTE(e){ if(!PT.down) return; const t=e.changedTouches[0]; ptEnd(t.clientX,t.clientY); }
function onMD(e){ if(e.button!==0) return; ptStart(e.clientX,e.clientY); }
function onMM(e){ ptMove(e.clientX,e.clientY); }
function onMU(e){ ptEnd(e.clientX,e.clientY); }

function updateDragBox(cx,cy){
  const db=el('dragbox');
  const wrap=el('map-wrap');
  const r=wrap.getBoundingClientRect();
  const ax=Math.min(PT.startX,cx)-r.left+wrap.scrollLeft;
  const ay=Math.min(PT.startY,cy)-r.top +wrap.scrollTop;
  const bx=Math.max(PT.startX,cx)-r.left+wrap.scrollLeft;
  const by=Math.max(PT.startY,cy)-r.top +wrap.scrollTop;
  db.style.display='block';
  db.style.left=ax+'px'; db.style.top=ay+'px';
  db.style.width=(bx-ax)+'px'; db.style.height=(by-ay)+'px';
}

function finalizeDrag(ex,ey){
  const wrap=el('map-wrap');
  const r=wrap.getBoundingClientRect();
  const ax=Math.min(PT.startX,ex)-r.left+wrap.scrollLeft;
  const ay=Math.min(PT.startY,ey)-r.top +wrap.scrollTop;
  const bx=Math.max(PT.startX,ex)-r.left+wrap.scrollLeft;
  const by=Math.max(PT.startY,ey)-r.top +wrap.scrollTop;
  const gx0=Math.floor(ax/CS),gy0=Math.floor(ay/CS);
  const gx1=Math.floor(bx/CS),gy1=Math.floor(by/CS);
  const sel=G.units.filter(u=>u.owner===(G.myP||1)&&u.x>=gx0&&u.x<=gx1&&u.y>=gy0&&u.y<=gy1);
  setBoxMode(false); // always exit box mode after drag
  if(sel.length>0){
    SEL.phase='sel'; SEL.selUnits=sel; SEL.selBldg=null;
    showMultiPanel(sel);
  } else resetSel();
  render();
}

// ════════════════════════════════════
// TAP LOGIC  ← core "tap cell then see actions"
// ════════════════════════════════════
function onTap(x,y){
  const f=fog1(x,y);
  const terrain=G.map[y][x];
  const myBldg=G.bldgs.find(b=>b.x===x&&b.y===y&&b.owner===G.myP);
  const myUnit=G.units.find(u=>u.x===x&&u.y===y&&u.owner===G.myP);
  const enBldg=f==='v'?G.bldgs.find(b=>b.x===x&&b.y===y&&b.owner!==G.myP):null;
  const enUnit=f==='v'?G.units.find(u=>u.x===x&&u.y===y&&u.owner!==G.myP):null;

  // ── BUILD PLACEMENT PHASE ──
  if(SEL.phase==='build_place'){
    if(canBuild(x,y)) execBuild(x,y);
    else glog('❌ 無法在此建造（非空地）');
    // keep worker selected after build placement
    const w=SEL.selUnits.find(u=>u.type==='worker');
    if(w){ SEL.phase='sel'; SEL.buildType=null; showUnitPanel(w); render(); }
    else resetSel();
    return;
  }

  // ── HAVE SELECTED UNITS ──
  if(SEL.selUnits.length>0){
    const units=SEL.selUnits;

    // Tap enemy → attack (keep selection)
    if(enUnit||enBldg){
      const tgt=enUnit||enBldg;
      multiAttack(units, tgt.id);
      glog(`⚔️ ${units.length}個單位攻擊 ${dsp(tgt)}`);
      refreshSelPanel(); return;
    }

    // Tap own damaged building with workers → offer repair
    if(myBldg&&myBldg.hp<myBldg.mhp){
      const wks=units.filter(u=>u.type==='worker');
      if(wks.length>0){
        multiRepair(wks, myBldg.id);
        glog(`🔧 ${wks.length}個Worker → 修復 ${myBldg.type}`);
        refreshSelPanel(); return;
      }
    }

    // Tap gold/tree with workers → harvest (keep selection)
    if(terrain===T.G||terrain===T.W){
      const wks=units.filter(u=>u.type==='worker');
      if(wks.length>0){
        multiHarvest(wks,[x,y]);
        glog(`⛏️ ${wks.length}個Worker採集${terrain===T.G?'💰':'🌲'}`);
        refreshSelPanel(); return;
      }
    }

    // Tap walkable cell → move (keep selection)
    if(canWalk(x,y)){
      multiMove(units, x, y);
      glog(`🚶 ${units.length}個單位→${cs(x,y)}`);
      refreshSelPanel(); return;
    }

    // Tap own unit → switch selection
    if(myUnit){ selectUnit(myUnit); return; }
    if(myBldg){ selectBldg(myBldg); return; }

    // Tap nothing useful → deselect
    resetSel(); return;
  }

  // ── NOTHING SELECTED ──
  if(myUnit){ selectUnit(myUnit); return; }
  if(myBldg){ selectBldg(myBldg); return; }

  // Info-only taps
  if(enUnit||enBldg){
    const e=enUnit||enBldg;
    setInfo(IC['e_'+e.type]||'👾',`敵方 ${e.type}`,`HP ${e.hp}/${e.mhp}`,'');
    setActions(`<span class="hint">先選我方士兵，再點此敵人攻擊</span>`); return;
  }
  if(terrain===T.G){setInfo('💰','金礦','可採集','');setActions(`<span class="hint">先選👷Worker，再點此採集</span>`);return;}
  if(terrain===T.W){setInfo('🌲','樹林','可砍伐','');setActions(`<span class="hint">先選👷Worker，再點此採集</span>`);return;}
  if(terrain===T.M){setInfo('🏔️','山地','不可通行','');setActions('');return;}
  if(f==='h'){setInfo('❓','未探索','','');setActions('');return;}

  resetSel();
}

// Refresh bottom panel without clearing selection
function refreshSelPanel(){
  if(SEL.selUnits.length===1) selectUnit(SEL.selUnits[0]);
  else if(SEL.selUnits.length>1) showMultiPanel(SEL.selUnits);
  else if(SEL.selBldg) selectBldg(SEL.selBldg);
  render();
}

// ════════════════════════════════════
// SELECT + PANELS
// ════════════════════════════════════
function selectUnit(u){
  SEL.phase='sel'; SEL.selUnits=[u]; SEL.selBldg=null;
  setInfo(IC[u.type], u.type, `HP ${u.hp}/${u.mhp}`, stateStr(u));
  showUnitPanel(u);
  render();
}

function selectBldg(b){
  SEL.phase='sel'; SEL.selUnits=[]; SEL.selBldg=b;
  setInfo(b.uc?'🏗️':(IC[b.type]||'🏠'), b.type+(b.uc?' (建造中)':''),
    `HP ${b.hp}/${b.mhp}`, b.tq.length?`隊列:${b.tq.length}`:'');
  showBldgPanel(b);
  render();
}

function showUnitPanel(u){
  const p=G.res[G.myP||1]; let html='';
  if(u.type==='worker'){
    html+=`<span class="hint">點地圖移動・點💰🌲採集・點受損建築修復・點敵人攻擊</span>`;
    html+=mkAbtn('🌾 建農場', '60🪙30🌲', p.gold>=60&&p.wood>=30, `startBuild('farm')`);
    html+=mkAbtn('⚔️ 建兵營', '120🪙50🌲', p.gold>=120&&p.wood>=50, `startBuild('barracks')`);
    html+=mkAbtn('🗼 建箭塔', '100🪙80🌲', p.gold>=100&&p.wood>=80, `startBuild('tower')`);
  } else {
    html+=`<span class="hint">點地圖移動・點敵人/建築攻擊</span>`;
  }
  html+=`<button class="ab" onclick="resetSel()">取消選擇</button>`;
  setActions(html);
  setInfo(IC[u.type], u.type, `HP ${u.hp}/${u.mhp}`, stateStr(u));
}

function showBldgPanel(b){
  if(b.uc){
    setActions(`<span class="hint">建造中 ${b.bp}/${b.bt} ticks</span><button class="ab" onclick="resetSel()">關閉</button>`);
    return;
  }
  const p=G.res[G.myP||1]; let html='';
  if(b.type==='townhall'){
    html+=mkAbtn('👷 訓練Worker','50🪙', p.gold>=50, `doTrain('${b.id}','worker')`);
  }
  if(b.type==='barracks'){
    const hf=p.food<p.foodMax;
    html+=mkAbtn('🗡️ 士兵','80🪙', p.gold>=80&&hf, `doTrain('${b.id}','soldier')`);
    html+=mkAbtn('🏹 弓手','100🪙', p.gold>=100&&hf, `doTrain('${b.id}','archer')`);
    if(!hf) html+=`<span class="hint" style="color:var(--r)">⚠️ 食物已滿，請先建農場</span>`;
    if(b.tq.length) html+=`<span class="hint">訓練隊列: ${b.tq.join(',')} (${b.tp}tick)</span>`;
  }
  if(b.type==='farm') html+=`<span class="hint">提供 +5 食物上限</span>`;
  if(b.type==='tower') html+=`<span class="hint">自動攻擊 ${BD.tower.rng} 格內敵人 (ATK ${BD.tower.atk})</span>`;
  html+=`<button class="ab" onclick="resetSel()">關閉</button>`;
  setActions(html);
}

function showMultiPanel(units){
  const t=[...new Set(units.map(u=>u.type))].join('+');
  setInfo('⚔️',`${units.length}個單位 (${t})`,'點地圖移動・點敵人攻擊','');
  setActions(`<span class="hint">點空地移動・點敵人攻擊</span><button class="ab" onclick="resetSel()">取消</button>`);
  render();
}

function startBuild(type){
  SEL.buildType=type; SEL.phase='build_place';
  setInfo('🏗️','選擇建造位置','點綠色高亮的空地','');
  setActions(`<span class="hint">點空地 (綠框) 放置 ${type}</span><button class="ab" onclick="resetSel()">取消</button>`);
  render();
}

function execBuild(x,y){
  const type=SEL.buildType;
  if(!canBuild(x,y)){glog('❌ 位置被佔用');return;}
  const worker=SEL.selUnits.find(u=>u.type==='worker');
  if(!worker){glog('❌ 需要Worker');return;}
  multiBuild(SEL.selUnits, type, [x,y]);
}

function doTrain(bldgId,utype){
  multiTrain(bldgId,utype);
}

function setBoxMode(on){
  SEL.boxMode=on;
  const btn=el('box-btn');
  if(!btn) return;
  if(on){
    btn.textContent='✕ 取消框選';
    btn.style.borderColor='var(--y)';
    btn.style.color='var(--y)';
  } else {
    btn.textContent='⬚ 框選';
    btn.style.borderColor='';
    btn.style.color='';
  }
}

function toggleBoxMode(){
  setBoxMode(!SEL.boxMode);
}

function resetSel(){
  SEL={phase:'idle',selUnits:[],selBldg:null,buildType:null,boxMode:false};
  setBoxMode(false);
  setInfo('🗺️','點選單位或建築','','');
  setActions('<span class="hint">點我方👷Worker或⚔️士兵開始<br>按 ⬚框選 可拖曳框選多個單位</span>');
  render();
}

// ════════════════════════════════════
// TICK
// ════════════════════════════════════
function tick(){
  if(G.over) return;
  G.tick++;
  el('h-tick').textContent='T'+G.tick;

  const dead=new Set();

  // Unit actions
  G.units.forEach(u=>{
    if(u.act==='move'&&u.tgt){
      const [tx,ty]=u.tgt;
      if(u.x===tx&&u.y===ty){u.act=null;u.tgt=null;return;} // arrived
      const s=step(u.x,u.y,tx,ty,u.id);
      if(s){ u.x=s[0]; u.y=s[1]; }
      else { u.act=null; u.tgt=null; }
    }
    else if(u.act==='harvest'&&u.tgt){
      const [tx,ty]=u.tgt;
      const dist=Math.abs(u.x-tx)+Math.abs(u.y-ty);
      if(dist<=1){
        const t=G.map[ty]?.[tx];
        if(t===T.G) G.res[u.owner].gold+=4;
        else if(t===T.W) G.res[u.owner].wood+=3;
      } else {
        const s=step(u.x,u.y,tx,ty,u.id);
        if(s){u.x=s[0];u.y=s[1];}
        else { u.act=null; u.tgt=null; }
      }
    }
    else if(u.act==='repair'&&u.tgt){
      const bldg=G.bldgs.find(b=>b.id===u.tgt);
      if(!bldg||bldg.hp>=bldg.mhp){u.act=null;u.tgt=null;return;} // done or destroyed
      const dist=Math.abs(u.x-bldg.x)+Math.abs(u.y-bldg.y);
      if(dist<=1){
        // repair costs 1 gold/tick per worker
        if(G.res[u.owner].gold>0){
          G.res[u.owner].gold-=1;
          bldg.hp=Math.min(bldg.mhp, bldg.hp+3);
          if(bldg.hp>=bldg.mhp){ glog(`✅ ${bldg.type} 修復完成`); u.act=null; u.tgt=null; }
        }
      } else {
        const s=step(u.x,u.y,bldg.x,bldg.y,u.id);
        if(s){u.x=s[0];u.y=s[1];}
        else {u.act=null;u.tgt=null;}
      }
    }
    else if(u.act==='attack'&&u.tgt){
      const tgt=byId(u.tgt);
      if(!tgt){u.act=null;u.tgt=null;return;} // target dead, go idle → auto-attack will pick next
      const dist=Math.abs(u.x-tgt.x)+Math.abs(u.y-tgt.y);
      if(dist<=u.rng){
        tgt.hp-=u.atk;
        if(G.tick%3===0) hitFx(tgt.x,tgt.y);
        if(tgt.hp<=0) dead.add(tgt.id);
      } else {
        const s=step(u.x,u.y,tgt.x,tgt.y,u.id);
        if(s){u.x=s[0];u.y=s[1];}
      }
    }
    else if(!u.act && (u.type==='soldier'||u.type==='archer')){
      // ── AUTO-ATTACK: scan vision for nearest enemy ──
      const enemy = 3 - u.owner; // opponent player number
      let nearest=null, nearestDist=999;
      // Check all visible enemies (units + buildings) within vision
      const targets=[
        ...G.units.filter(e=>e.owner===enemy),
        ...G.bldgs.filter(e=>e.owner===enemy),
      ];
      targets.forEach(e=>{
        if(!canSee(u.owner, e.x, e.y)) return;
        const d=Math.abs(u.x-e.x)+Math.abs(u.y-e.y);
        if(d<nearestDist){ nearestDist=d; nearest=e; }
      });
      if(nearest){ u.act='attack'; u.tgt=nearest.id; }
    }
  });

  // Tower auto-attack
  G.bldgs.filter(b=>b.type==='tower'&&!b.uc).forEach(tw=>{
    G.units.filter(u=>u.owner!==tw.owner
      && Math.abs(u.x-tw.x)+Math.abs(u.y-tw.y)<=BD.tower.rng
      && G.fog[tw.owner-1][u.y][u.x]==='v')
    .slice(0,1).forEach(u=>{
      u.hp-=BD.tower.atk;
      if(u.hp<=0) dead.add(u.id);
    });
  });

  // Resolve deaths — hp is only written down here, no regen anywhere
  dead.forEach(id=>{
    const ui=G.units.findIndex(u=>u.id===id);
    if(ui!==-1){
      const u=G.units[ui];
      G.res[u.owner].food-=u.food;
      glog(`💀 ${dsp(u)} 陣亡`);
      G.units.splice(ui,1);
      SEL.selUnits=SEL.selUnits.filter(u=>u.id!==id);
    }
    const bi=G.bldgs.findIndex(b=>b.id===id);
    if(bi!==-1){
      const b=G.bldgs[bi];
      if(b.type==='townhall'){G.over=true;G.winner=b.owner===1?2:1;showWin();}
      // Refund food capacity — only if building was completed
      if(b.type==='farm'&&!b.uc) G.res[b.owner].foodMax-=BD.farm.food;
      if(b.type==='townhall'&&!b.uc) G.res[b.owner].foodMax-=BD.townhall.food;
      glog(`💥 ${dsp(b)} 被摧毀`);
      G.bldgs.splice(bi,1);
      if(SEL.selBldg?.id===id) resetSel();
    }
  });

  // Building construction
  G.bldgs.forEach(b=>{
    if(b.uc&&b.bp<b.bt){
      b.bp++;
      if(b.bp>=b.bt){
        b.uc=false;
        glog(`✅ ${b.type} 建造完成 (${cs(b.x,b.y)})`);
        if(BD[b.type].food) G.res[b.owner].foodMax+=BD[b.type].food;
        if(SEL.selBldg?.id===b.id) showBldgPanel(b);
      }
    }
    // Training queue
    if(!b.uc&&b.tq.length>0){
      b.tp++;
      const need=b.tq[0]==='worker'?12:b.tq[0]==='soldier'?10:14;
      if(b.tp>=need){
        const ut=b.tq.shift(); b.tp=0;
        const pos=nearEmpty(b.x,b.y);
        if(pos){ addUnit(ut,b.owner,pos[0],pos[1]); glog(`🎖️ ${ut} 訓練完成`); }
        if(SEL.selBldg?.id===b.id) showBldgPanel(b);
      }
    } else if(!b.uc&&b.tq.length===0){
      b.tp=0; // reset counter when queue is empty
    }
  });

  // (AI disabled in solo test mode)
  updateFog(); updateHUD(); render();
}

// ════════════════════════════════════
// AI
// ════════════════════════════════════
function aiAct(){
  const p=G.res[2];
  const myU=G.units.filter(u=>u.owner===2);
  const myB=G.bldgs.filter(b=>b.owner===2);
  const workers=myU.filter(u=>u.type==='worker');
  const fighters=myU.filter(u=>u.type==='soldier'||u.type==='archer');
  const th=myB.find(b=>b.type==='townhall');
  const barr=myB.find(b=>b.type==='barracks'&&!b.uc);

  // Workers: keep harvesting
  workers.forEach(w=>{
    if(!w.act||w.act==='move'){
      const gm=nearTile(w.x,w.y,T.G); if(gm){w.act='harvest';w.tgt=gm;}
    }
  });

  // Build farm if food capped
  if(p.food>=p.foodMax-1&&p.gold>=60&&p.wood>=30&&!myB.find(b=>b.type==='farm'&&b.uc)){
    const pos=nearEmpty(th?.x||22,th?.y||10,4);
    if(pos){addBldg('farm',2,pos[0],pos[1],true);p.gold-=60;p.wood-=30;}
  }
  // Build barracks
  if(!myB.find(b=>b.type==='barracks')&&p.gold>=120&&p.wood>=50){
    const pos=nearEmpty(th?.x||22,th?.y||10,5);
    if(pos){addBldg('barracks',2,pos[0],pos[1],true);p.gold-=120;p.wood-=50;}
  }
  // Train soldiers
  if(barr&&p.gold>=80&&p.food<p.foodMax){barr.tq.push('soldier');p.gold-=80;}
  // Train worker if low
  if(workers.length<2&&th&&p.gold>=50&&!th.tq.length){th.tq.push('worker');p.gold-=50;}

  // Attack
  const p1th=G.bldgs.find(b=>b.owner===1&&b.type==='townhall');
  fighters.forEach(s=>{
    if(s.act==='attack'&&byId(s.tgt)) return; // already attacking something alive
    const near=G.units.find(u=>u.owner===1&&Math.abs(u.x-s.x)+Math.abs(u.y-s.y)<=8);
    if(near){s.act='attack';s.tgt=near.id;}
    else if(p1th){s.act='move';s.tgt=[p1th.x,p1th.y];}
  });
}

// ════════════════════════════════════
// UTILS
// ════════════════════════════════════
function el(id){return document.getElementById(id);}
function inB(x,y){return x>=0&&x<MW&&y>=0&&y<MH;}
function cs(x,y){return String.fromCharCode(65+x)+(y+1);}
function dsp(e){return (e.owner===2?'敵':'')+e.id.replace(/p\d$/,'');}
function byId(id){return G.units.find(u=>u.id===id)||G.bldgs.find(b=>b.id===id);}
function stateStr(u){
  if(!u.act) return '待機';
  if(u.act==='move') return `移動→${u.tgt?cs(u.tgt[0],u.tgt[1]):''}`;
  if(u.act==='harvest') return '採集中';
  if(u.act==='attack') return '攻擊中';
  if(u.act==='repair') return '修復中';
  return u.act;
}

function canWalk(x,y){
  if(!inB(x,y)) return false;
  if(G.map[y][x]===T.M) return false;
  if(G.bldgs.find(b=>b.x===x&&b.y===y)) return false;
  return true;
}
function canBuild(x,y){
  if(!inB(x,y)||G.map[y][x]!==T.E) return false;
  return !G.bldgs.find(b=>b.x===x&&b.y===y);
}

// Pathfinding step: move one cell toward (tx,ty)
// Pass 1: avoid all other units. Pass 2: allow stepping on friendlies.
function step(fx,fy,tx,ty,selfId){
  const dx=tx-fx, dy=ty-fy;
  if(!dx&&!dy) return null;
  const sx=dx>0?1:dx<0?-1:0;
  const sy=dy>0?1:dy<0?-1:0;
  // Candidates ordered by preference
  const cands=Math.abs(dx)>=Math.abs(dy)
    ? [[fx+sx,fy],[fx,fy+sy],[fx+sx,fy+sy]]
    : [[fx,fy+sy],[fx+sx,fy],[fx+sx,fy+sy]];
  const self=G.units.find(u=>u.id===selfId);
  // Pass 1: no unit collision
  for(const [nx,ny] of cands){
    if(!canWalk(nx,ny)) continue;
    if(!G.units.find(u=>u.id!==selfId&&u.x===nx&&u.y===ny)) return [nx,ny];
  }
  // Pass 2: allow friendly overlap as last resort (avoids deadlock)
  for(const [nx,ny] of cands){
    if(!canWalk(nx,ny)) continue;
    const bl=G.units.find(u=>u.id!==selfId&&u.x===nx&&u.y===ny);
    if(bl&&self&&bl.owner===self.owner) return [nx,ny];
  }
  return null;
}

// Assign distinct destinations around (cx,cy) for multiple units
// Units closest to target get the best spots
function assignSpreadMove(units, cx, cy){
  // Generate candidate cells around target in rings, sorted by distance from target
  const cands=[];
  for(let r=0;r<=4;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
    if(Math.max(Math.abs(dx),Math.abs(dy))!==r) continue; // only ring edge
    const nx=cx+dx, ny=cy+dy;
    if(canWalk(nx,ny)) cands.push([nx,ny,Math.abs(dx)+Math.abs(dy)]);
  }
  cands.sort((a,b)=>a[2]-b[2]);

  // Sort units by current distance to target (closest first gets best spot)
  const sorted=[...units].sort((a,b)=>
    (Math.abs(a.x-cx)+Math.abs(a.y-cy))-(Math.abs(b.x-cx)+Math.abs(b.y-cy)));

  const used=new Set();
  sorted.forEach(u=>{
    const spot=cands.find(([nx,ny])=>!used.has(`${nx},${ny}`));
    if(spot){ used.add(`${spot[0]},${spot[1]}`); u.act='move'; u.tgt=[spot[0],spot[1]]; }
    else { u.act='move'; u.tgt=[cx,cy]; } // fallback
  });
}


function nearEmpty(cx,cy,r=4){
  for(let rd=1;rd<=r;rd++) for(let dy=-rd;dy<=rd;dy++) for(let dx=-rd;dx<=rd;dx++){
    const x=cx+dx,y=cy+dy;
    if(canBuild(x,y)&&!G.units.find(u=>u.x===x&&u.y===y)) return [x,y];
  } return null;
}
function nearTile(cx,cy,type){
  let best=null,bd=999;
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++) if(G.map[y][x]===type){
    const d=Math.abs(x-cx)+Math.abs(y-cy); if(d<bd){bd=d;best=[x,y];}
  } return best;
}

function hitFx(x,y){
  const d=CE[`${x},${y}`]; if(!d) return;
  d.classList.add('hit-fx');
  setTimeout(()=>d.classList.remove('hit-fx'),360);
}

// ════════════════════════════════════
// UI
// ════════════════════════════════════
function setInfo(icon,name,hp,state){
  el('i-icon').textContent=icon;
  el('i-name').textContent=name;
  el('i-hp').textContent=hp;
  el('i-state').textContent=state;
}
function setActions(html){el('action-bar').innerHTML=html;}
function glog(msg){el('logbar').textContent=msg;}
function updateHUD(){
  const p=G.res[G.myP||1];
  el('h-gold').textContent=p.gold;
  el('h-wood').textContent=p.wood;
  el('h-food').textContent=p.food;
  el('h-fmax').textContent=p.foodMax;
}

function mkAbtn(label,cost,ok,cb){
  return `<button class="ab${ok?'':' off'}" ${ok?`onclick="${cb}"`:''}>${label}<span class="co">${cost}</span></button>`;
}

function cycleSpeed(){
  speedLv=speedLv===1?2:speedLv===2?4:1;
  el('speed-btn').textContent=speedLv+'x';
  clearInterval(tickTmr);
  tickTmr=setInterval(()=>{tick();if(G.over)clearInterval(tickTmr);},Math.round(TICK_MS/speedLv));
}

function showWin(){
  clearInterval(tickTmr);
  el('win-txt').textContent=G.winner===1?'🏆 勝利！':'💀 敗北...';
  el('win-sub').textContent=`Tick ${G.tick} — ${G.winner===1?'摧毀敵方主城':'主城被摧毀'}`;
  el('win-ovl').classList.add('show');
}

function goMenu(){
  clearInterval(tickTmr);
  if(conn){try{conn.close();}catch(e){} conn=null;}
  if(peer){try{peer.destroy();}catch(e){} peer=null;}
  P2cmdQueue=[];
  el('game').style.display='none';
  el('win-ovl').classList.remove('show');
  el('speed-btn').style.display='';
  el('menu').style.display='flex';
  resetSel();
}
