<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WAR.SH v1.3.0</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Share+Tech+Mono&display=swap');
:root{
  --bg:#0b0d0f;--panel:#111518;--bdr:#1c2a1c;
  --g:#4dff7c;--g2:#2aaa50;--g3:#0d2a18;
  --r:#ff4444;--r2:#7a1a1a;--b:#44aaff;
  --y:#ffcc44;--y2:#7a6010;
  --fog:#060708;--seen:#0c0f0c;--vis:#0e180f;
  --txt:#8aaa8a;--dim:#3a5a3a;
  --cs:44px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:var(--bg);}
body{font-family:'Rajdhani',sans-serif;display:flex;flex-direction:column;height:100dvh;color:var(--g);user-select:none;}

/* ─ MENU ─ */
#menu{display:flex;flex-direction:column;align-items:center;justify-content:center;
  flex:1;gap:18px;padding:32px;
  background:radial-gradient(ellipse at 50% 40%,#0d2018 0%,var(--bg) 65%);}
.logo{font-family:'Share Tech Mono',monospace;font-size:clamp(2.4rem,11vw,4.5rem);
  color:var(--g);letter-spacing:.05em;animation:glow 2.5s ease-in-out infinite;}
@keyframes glow{0%,100%{text-shadow:0 0 30px #4dff7c55;}50%{text-shadow:0 0 60px #4dff7caa;}}
.logo-sub{font-size:12px;color:var(--dim);letter-spacing:.4em;margin-top:-12px;}
.mbtn{width:100%;max-width:300px;padding:15px 20px;background:transparent;
  border:1px solid var(--g2);color:var(--g);font-family:'Rajdhani';font-size:16px;
  font-weight:700;letter-spacing:.1em;cursor:pointer;position:relative;text-align:left;}
.mbtn::after{content:'▶';position:absolute;right:16px;color:var(--g2);font-size:11px;}
.mbtn:active{background:var(--g3);}
.mbtn.pri{border-color:var(--g);}

/* ─ PEER OVERLAY ─ */
#peer-ovl{display:none;position:fixed;inset:0;background:#000c;z-index:200;
  align-items:center;justify-content:center;}
#peer-ovl.show{display:flex;}
#peer-box{background:var(--panel);border:1px solid var(--g2);padding:24px 20px;
  width:90%;max-width:320px;display:flex;flex-direction:column;gap:12px;align-items:center;}
#peer-box h3{font-family:'Share Tech Mono';font-size:.95rem;color:var(--g);text-align:center;letter-spacing:.1em;}
#peer-room-code{font-size:0.85rem;letter-spacing:.08em;color:var(--y);font-family:'Share Tech Mono';
  text-align:center;padding:8px;word-break:break-all;background:var(--g3);width:100%;}
#peer-input{background:var(--g3);border:1px solid var(--g2);color:var(--g);
  padding:10px;font-family:'Share Tech Mono';font-size:1.6rem;letter-spacing:.25em;
  width:100%;text-align:center;outline:none;}
#peer-msg{font-size:12px;color:var(--txt);text-align:center;line-height:1.5;}
.pbtn{padding:11px 28px;background:var(--g3);border:1px solid var(--g);color:var(--g);
  font-family:'Rajdhani';font-size:15px;font-weight:700;cursor:pointer;width:100%;}
.pbtn.dim{border-color:var(--dim);color:var(--dim);background:transparent;}

/* ─ GAME ─ */
#game{display:none;flex-direction:column;height:100dvh;}

/* HUD */
#hud{display:flex;align-items:center;background:var(--panel);
  border-bottom:1px solid var(--bdr);flex-shrink:0;height:40px;padding:0 8px;}
.hr{display:flex;align-items:center;gap:4px;padding:0 8px;
  border-right:1px solid var(--bdr);height:100%;font-size:14px;font-weight:700;}
.hr-v{color:var(--y);}
.hr-l{color:var(--dim);font-size:11px;}
#h-tick{margin-left:auto;font-family:'Share Tech Mono';font-size:11px;color:var(--dim);}
#speed-btn{margin-left:6px;padding:2px 8px;background:var(--g3);border:1px solid var(--g2);
  color:var(--g);font-size:11px;cursor:pointer;font-family:'Share Tech Mono';}
#menu-btn{margin-left:4px;padding:2px 8px;background:transparent;border:1px solid var(--dim);
  color:var(--dim);font-size:11px;cursor:pointer;font-family:'Share Tech Mono';}

/* MAP AREA */
#map-wrap{flex:1;overflow:hidden;position:relative;background:var(--fog);cursor:default;}
#map-canvas{position:absolute;top:0;left:0;touch-action:none;}

/* CELLS */
.cell{position:absolute;width:var(--cs);height:var(--cs);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;border:1px solid transparent;overflow:hidden;}
.cell.fog{background:var(--fog);}
.cell.seen{background:var(--seen);}
.cell.vis{background:var(--vis);}
/* highlights */
.cell.h-sel{border-color:var(--g)!important;box-shadow:inset 0 0 8px #4dff7c33;}
.cell.h-build{border-color:var(--g2)!important;background:#4dff7c08!important;}
/* coord label */
.clbl{position:absolute;top:1px;left:2px;font-size:7px;color:var(--dim);
  opacity:.5;font-family:'Share Tech Mono';pointer-events:none;}
/* hp bar */
.hpb{position:absolute;bottom:1px;left:2px;right:2px;height:3px;background:#111;border-radius:1px;}
.hpf{height:100%;border-radius:1px;}
.hpf.my{background:var(--g);}
.hpf.en{background:var(--r);}
.hpf.lo{background:var(--y);}
/* drag box for multi-select */
#dragbox{position:absolute;pointer-events:none;
  border:1px dashed var(--g);background:#4dff7c08;display:none;z-index:5;}

/* BOTTOM PANEL */
#bottom{flex-shrink:0;background:var(--panel);border-top:1px solid var(--bdr);
  display:flex;flex-direction:column;min-height:120px;max-height:42vh;}
#info-bar{display:flex;align-items:center;gap:8px;padding:5px 12px;
  border-bottom:1px solid var(--bdr);flex-shrink:0;min-height:32px;}
#i-icon{font-size:17px;}
#i-name{color:var(--g);font-size:13px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;}
#i-hp{color:var(--txt);font-size:11px;white-space:nowrap;}
#i-state{font-size:11px;color:var(--y);margin-left:4px;white-space:nowrap;}
#action-bar{display:flex;flex-wrap:wrap;gap:5px;padding:6px 10px;
  overflow-y:auto;flex:1;align-content:flex-start;}
.ab{padding:7px 12px;background:var(--g3);border:1px solid var(--g2);color:var(--g);
  font-family:'Rajdhani';font-size:14px;font-weight:700;cursor:pointer;
  border-radius:2px;white-space:nowrap;}
.ab:active{background:var(--g2);}
.ab.rd{border-color:var(--r2);color:var(--r);background:#180808;}
.ab.yl{border-color:var(--y2);color:var(--y);background:#181200;}
.ab.off{opacity:.3;pointer-events:none;}
.ab .co{font-size:10px;color:var(--dim);}
.hint{color:var(--dim);font-size:12px;padding:6px 4px;line-height:1.7;align-self:center;}
#logbar{border-top:1px solid var(--bdr);padding:3px 12px;font-family:'Share Tech Mono';
  font-size:11px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;}

/* WIN */
#win-ovl{display:none;position:fixed;inset:0;background:#000c;z-index:300;
  align-items:center;justify-content:center;flex-direction:column;gap:14px;}
#win-ovl.show{display:flex;}
#win-txt{font-family:'Share Tech Mono';font-size:2rem;color:var(--g);text-shadow:0 0 30px var(--g);}
#win-sub{color:var(--txt);font-size:13px;}

@keyframes hit{0%,100%{opacity:1}50%{opacity:.25}}
.cell.hit-fx{animation:hit .18s ease-in-out 2;}
</style>
</head>
<body>

<!-- MENU -->
<div id="menu">
  <div class="logo">WAR.SH</div>
  <div class="logo-sub">點選即時戰略 &nbsp;v1.3.0</div>
  <button class="mbtn pri" onclick="startSolo()">單人測試 (AI對手)</button>
  <button class="mbtn" onclick="openPeer('host')">Host — 開房間</button>
  <button class="mbtn" onclick="openPeer('guest')">Guest — 加入房間</button>
</div>

<!-- PEER OVERLAY -->
<div id="peer-ovl">
  <div id="peer-box">
    <h3 id="peer-title">──  ──</h3>
    <div id="peer-room-code" style="display:none"></div>
    <input id="peer-input" maxlength="60" placeholder="貼上 Host 的ID"
      style="display:none" oninput="this.value=this.value.trim()">
    <div id="peer-msg">初始化...</div>
    <button class="pbtn" id="peer-connect-btn" onclick="guestConnect()" style="display:none">連線</button>
    <button class="pbtn dim" onclick="closePeer()">取消</button>
  </div>
</div>

<!-- GAME -->
<div id="game">
  <div id="hud">
    <div class="hr"><span>🪙</span><span class="hr-v" id="h-gold">0</span></div>
    <div class="hr"><span>🌲</span><span class="hr-v" id="h-wood">0</span></div>
    <div class="hr"><span>🍖</span><span class="hr-v" id="h-food">0</span><span class="hr-l">/</span><span class="hr-v" id="h-fmax">10</span></div>
    <div id="h-tick" style="margin-left:auto;font-family:'Share Tech Mono';font-size:11px;color:var(--dim)">T0</div>
    <button id="speed-btn" onclick="cycleSpeed()">1x</button>
    <button id="menu-btn" onclick="goMenu()">離開</button>
  </div>
  <div id="map-wrap">
    <div id="map-canvas"></div>
    <div id="dragbox"></div>
  </div>
  <div id="bottom">
    <div id="info-bar">
      <span id="i-icon">🗺️</span>
      <span id="i-name">點選單位或建築</span>
      <span id="i-hp"></span>
      <span id="i-state"></span>
      <button id="box-btn" onclick="toggleBoxMode()"
        style="margin-left:auto;padding:2px 10px;background:var(--g3);border:1px solid var(--g2);
               color:var(--g);font-family:'Rajdhani';font-size:12px;font-weight:700;
               cursor:pointer;white-space:nowrap;flex-shrink:0;">⬚ 框選</button>
    </div>
    <div id="action-bar"><span class="hint">點我方👷Worker或⚔️士兵開始<br>拖曳可框選多個單位</span></div>
    <div id="logbar">── WAR.SH 開始 ──</div>
  </div>
</div>

<!-- WIN -->
<div id="win-ovl">
  <div id="win-txt"></div>
  <div id="win-sub"></div>
  <button class="pbtn" onclick="goMenu()" style="max-width:200px;margin-top:8px">返回主選單</button>
</div>

<script>
'use strict';
// ════════════════════════════════════
// WAR.SH v1.3.0 — Rewritten Architecture
// ════════════════════════════════════
const MW=24,MH=20,CS=44,TICK_MS=1000;
const T={E:0,G:1,W:2,M:3};

// Display labels
const IC={
  townhall:'主城',farm:'農場',barracks:'兵營',tower:'箭塔',
  worker:'Worker',soldier:'Soldier',archer:'Archer',
  e_townhall:'敵主城',e_farm:'敵農場',e_barracks:'敵兵營',e_tower:'敵箭塔',
  e_worker:'敵Worker',e_soldier:'敵Soldier',e_archer:'敵Archer',
};

// Game balance
const BD={
  townhall:{cost:{g:0,w:0},   hp:300,food:10,bt:0},
  farm:    {cost:{g:60,w:30}, hp:80, food:5, bt:8},
  barracks:{cost:{g:120,w:50},hp:120,food:0, bt:12},
  tower:   {cost:{g:150,w:100},hp:120,food:0,bt:18,atk:5,rng:3},
};
const UD={
  worker: {cost:{g:50}, hp:30,mhp:30,atk:2,def:0,rng:1,vis:3,food:0},
  soldier:{cost:{g:90}, hp:90,mhp:90,atk:8,def:3,rng:1,vis:2,food:1},
  archer: {cost:{g:100},hp:50,mhp:50,atk:5,def:1,rng:3,vis:3,food:1},
};

// ════════════════════════════════════
// SVG SPRITES (pre-generated once)
// ════════════════════════════════════
const MC={body:'#2aaa50',dark:'#1a6630',light:'#4dff7c',skin:'#c8a060',acc:'#ffcc44',boot:'#4a3010'};
const EC={body:'#aa2222',dark:'#7a1a1a',light:'#cc4444',skin:'#a06040',acc:'#cc4444',boot:'#2a1010'};
function sw(inner){return `<svg viewBox="0 0 44 44" width="40" height="40" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;}

function mkWorker(C){return sw(`
  <rect x="17" y="4" width="10" height="9" rx="2" fill="${C.skin}"/>
  <rect x="16" y="7" width="12" height="5" rx="2" fill="${C.acc}"/>
  <rect x="18" y="4" width="8" height="3" rx="1" fill="${C.dark}"/>
  <rect x="18" y="10" width="3" height="2" fill="#111"/><rect x="23" y="10" width="3" height="2" fill="#111"/>
  <rect x="15" y="13" width="14" height="15" rx="2" fill="${C.body}"/>
  <rect x="13" y="13" width="5" height="11" rx="1" fill="${C.dark}"/>
  <rect x="26" y="13" width="5" height="11" rx="1" fill="${C.dark}"/>
  <rect x="29" y="18" width="2" height="10" rx="1" fill="#8a6030"/>
  <rect x="27" y="16" width="6" height="3" rx="1" fill="#888"/>
  <rect x="15" y="28" width="5" height="8" rx="1" fill="${C.dark}"/>
  <rect x="24" y="28" width="5" height="8" rx="1" fill="${C.dark}"/>
  <rect x="14" y="34" width="7" height="4" rx="1" fill="${C.boot}"/>
  <rect x="23" y="34" width="7" height="4" rx="1" fill="${C.boot}"/>`);}

function mkSoldier(C){const ec=C===EC?'#ff2222':'#111';return sw(`
  <rect x="17" y="3" width="10" height="10" rx="2" fill="${C.skin}"/>
  <rect x="15" y="2" width="14" height="7" rx="2" fill="${C.body}"/>
  <rect x="16" y="1" width="12" height="4" rx="1" fill="${C.dark}"/>
  <rect x="16" y="8" width="12" height="3" rx="0" fill="#111" opacity=".7"/>
  <rect x="18" y="9" width="3" height="2" fill="${ec}" opacity=".9"/>
  <rect x="23" y="9" width="3" height="2" fill="${ec}" opacity=".9"/>
  <rect x="14" y="13" width="16" height="17" rx="2" fill="${C.body}"/>
  <rect x="15" y="18" width="14" height="2" fill="${C.dark}"/>
  <rect x="15" y="22" width="14" height="2" fill="${C.dark}"/>
  <rect x="7" y="13" width="7" height="12" rx="2" fill="${C.acc}"/>
  <rect x="8" y="14" width="5" height="10" rx="1" fill="${C===EC?'#7a1a1a':'#aa8822'}"/>
  <rect x="30" y="10" width="3" height="16" rx="1" fill="#aaa"/>
  <rect x="26" y="14" width="8" height="3" rx="0" fill="#888"/>
  <rect x="30" y="24" width="3" height="6" rx="1" fill="#8a6030"/>
  <rect x="15" y="30" width="6" height="8" rx="1" fill="${C.body}"/>
  <rect x="23" y="30" width="6" height="8" rx="1" fill="${C.body}"/>
  <rect x="14" y="36" width="8" height="4" rx="1" fill="${C.boot}"/>
  <rect x="22" y="36" width="8" height="4" rx="1" fill="${C.boot}"/>`);}

function mkArcher(C){const ec=C===EC?'#ff2222':'#111';return sw(`
  <rect x="18" y="5" width="9" height="10" rx="2" fill="${C.skin}"/>
  <rect x="16" y="2" width="13" height="9" rx="4" fill="${C.body}"/>
  <rect x="17" y="3" width="11" height="7" rx="3" fill="${C.dark}" opacity=".5"/>
  <rect x="19" y="11" width="3" height="2" rx="1" fill="${ec}" opacity=".9"/>
  <rect x="23" y="11" width="3" height="2" rx="1" fill="${ec}" opacity=".9"/>
  <rect x="16" y="15" width="14" height="17" rx="2" fill="${C.dark}"/>
  <rect x="30" y="14" width="4" height="12" rx="2" fill="#8a6030"/>
  <rect x="31" y="12" width="2" height="3" fill="${C.acc}"/>
  <rect x="33" y="11" width="2" height="4" fill="${C.acc}"/>
  <path d="M 8 8 Q 4 22 8 36" stroke="#8a6030" stroke-width="3" fill="none"/>
  <line x1="8" y1="9" x2="8" y2="35" stroke="#c8c0a0" stroke-width="1"/>
  <line x1="8" y1="22" x2="26" y2="18" stroke="#c8c0a0" stroke-width="1.5"/>
  <polygon points="26,18 22,15 22,21" fill="${C===EC?'#cc4444':'#aaa'}"/>
  <rect x="16" y="32" width="6" height="8" rx="1" fill="${C.dark}"/>
  <rect x="24" y="32" width="6" height="8" rx="1" fill="${C.dark}"/>`);}

function mkTownhall(C){const fl=C===MC?'#4dff7c':'#cc4444';return sw(`
  <rect x="6" y="26" width="32" height="14" rx="1" fill="${C.dark}"/>
  <rect x="8" y="24" width="28" height="14" rx="1" fill="${C.body}"/>
  <rect x="17" y="28" width="10" height="10" rx="1" fill="#111"/>
  <rect x="6" y="12" width="9" height="16" rx="1" fill="${C.body}"/>
  <rect x="29" y="12" width="9" height="16" rx="1" fill="${C.body}"/>
  <rect x="5" y="8" width="5" height="6" rx="1" fill="${C.dark}"/>
  <rect x="11" y="8" width="5" height="6" rx="1" fill="${C.dark}"/>
  <rect x="29" y="8" width="5" height="6" rx="1" fill="${C.dark}"/>
  <rect x="35" y="8" width="5" height="6" rx="1" fill="${C.dark}"/>
  <rect x="15" y="6" width="14" height="20" rx="1" fill="${C.dark}"/>
  <rect x="16" y="7" width="12" height="18" rx="1" fill="${C.body}"/>
  <rect x="19" y="10" width="6" height="7" rx="1" fill="#111"/>
  <rect x="21" y="2" width="2" height="6" fill="${fl}"/>
  <polygon points="23,2 30,5 23,8" fill="${fl}"/>`);}

function mkFarm(C){const wc=C===MC?'#ffcc44':'#8a4020',sc=C===MC?'#6a4020':'#4a2010';return sw(`
  <rect x="4" y="28" width="36" height="12" rx="2" fill="${sc}"/>
  <rect x="6" y="26" width="32" height="12" rx="2" fill="${C===MC?'#8a6030':'#6a3020'}"/>
  <line x1="8" y1="30" x2="36" y2="30" stroke="${sc}" stroke-width="1.5"/>
  <line x1="8" y1="34" x2="36" y2="34" stroke="${sc}" stroke-width="1.5"/>
  <rect x="8" y="14" width="3" height="12" rx="1" fill="${C===MC?'#8a6030':'#6a3010'}"/>
  <ellipse cx="10" cy="12" rx="4" ry="6" fill="${wc}"/>
  <rect x="15" y="10" width="3" height="16" rx="1" fill="${C===MC?'#8a6030':'#6a3010'}"/>
  <ellipse cx="17" cy="8" rx="4" ry="6" fill="${wc}"/>
  <rect x="22" y="14" width="3" height="12" rx="1" fill="${C===MC?'#8a6030':'#6a3010'}"/>
  <ellipse cx="24" cy="12" rx="4" ry="6" fill="${wc}"/>
  <rect x="29" y="10" width="3" height="16" rx="1" fill="${C===MC?'#8a6030':'#6a3010'}"/>
  <ellipse cx="31" cy="8" rx="4" ry="6" fill="${wc}"/>
  <rect x="4" y="22" width="36" height="3" fill="${C===MC?'#8a6030':'#6a3010'}"/>`);}

function mkBarracks(C){const fl=C===MC?'#4dff7c':'#ff4444';return sw(`
  <rect x="5" y="22" width="34" height="18" rx="1" fill="${C.dark}"/>
  <rect x="7" y="20" width="30" height="18" rx="1" fill="${C.body}"/>
  <polygon points="4,22 22,6 40,22" fill="${C.dark}"/>
  <polygon points="6,22 22,8 38,22" fill="${C.body}" opacity=".5"/>
  <rect x="17" y="26" width="10" height="14" rx="1" fill="#111"/>
  <rect x="8" y="24" width="7" height="7" rx="1" fill="#111"/>
  <rect x="29" y="24" width="7" height="7" rx="1" fill="#111"/>
  <line x1="18" y1="12" x2="22" y2="18" stroke="${fl}" stroke-width="2"/>
  <line x1="22" y1="12" x2="18" y2="18" stroke="${fl}" stroke-width="2"/>`);}

function mkTower(C){const ac=C===MC?'#4dff7c':'#ff4444';return sw(`
  <rect x="13" y="32" width="18" height="10" rx="1" fill="${C.dark}"/>
  <rect x="15" y="16" width="14" height="20" rx="1" fill="${C.body}"/>
  <rect x="16" y="17" width="12" height="18" rx="1" fill="${C.dark}" opacity=".4"/>
  <rect x="19" y="20" width="6" height="10" rx="0" fill="#111"/>
  <rect x="21" y="16" width="2" height="14" rx="0" fill="#111"/>
  <rect x="13" y="8" width="5" height="9" rx="1" fill="${C.body}"/>
  <rect x="19" y="8" width="4" height="9" rx="1" fill="${C.body}"/>
  <rect x="24" y="8" width="5" height="9" rx="1" fill="${C.body}"/>
  <line x1="22" y1="23" x2="36" y2="14" stroke="${ac}" stroke-width="1.5" stroke-dasharray="2,2"/>
  <polygon points="36,14 32,13 33,17" fill="${ac}"/>`);}

function mkGold(){return sw(`
  <ellipse cx="22" cy="30" rx="14" ry="9" fill="#555"/>
  <ellipse cx="22" cy="28" rx="13" ry="8" fill="#777"/>
  <ellipse cx="19" cy="26" rx="6" ry="4" fill="#ffcc44"/>
  <ellipse cx="26" cy="29" rx="4" ry="3" fill="#ffcc44"/>

// ════════════════════════════════════
// FOG — incremental update
// ════════════════════════════════════
// fog values stored as numbers: 0=hidden 1=seen 2=visible (faster than string compare)
// fog arrays: G.fog[playerIdx][y][x] = 0|1|2

function initFog(){
  G.fog=[[],[]];
  for(let p=0;p<2;p++){
    G.fog[p]=[];
    for(let y=0;y<MH;y++){G.fog[p].push(new Uint8Array(MW));}// 0=hidden
  }
}

// Track which entities revealed fog last tick (for incremental update)
let fogRevealers={1:[], 2:[]};// [owner] -> [{x,y,vis}] previous positions

function updateFog(){
  // Decay vis(2)→seen(1) only for cells we previously revealed
  // Then re-reveal from current positions
  const allE=[...G.units,...G.bldgs];
  const newRevealers={1:[],2:[]};

  // Decay previous visible cells
  for(const p of [1,2]){
    for(const {x,y,vis} of fogRevealers[p]){
      const v=vis||(BD['tower']?.rng?BD['tower'].rng+1:2);
      for(let dy=-v-1;dy<=v+1;dy++) for(let dx=-v-1;dx<=v+1;dx++){
        const nx=x+dx,ny=y+dy;
        if(inB(nx,ny)&&G.fog[p-1][ny][nx]===2) G.fog[p-1][ny][nx]=1;
      }
    }
  }

  // Reveal from current entity positions
  for(const e of allE){
    const p=e.owner-1;
    const v=e.vis||(BD[e.type]?.rng?BD[e.type].rng+1:2);
    for(let dy=-v;dy<=v;dy++) for(let dx=-v;dx<=v;dx++){
      const nx=e.x+dx,ny=e.y+dy;
      if(inB(nx,ny)&&Math.abs(dx)+Math.abs(dy)<=v+1) G.fog[p][ny][nx]=2;
    }
    newRevealers[e.owner].push({x:e.x,y:e.y,vis:v});
  }
  fogRevealers=newRevealers;
}

function fog1(x,y){return G.fog[(G.myP||1)-1]?.[y]?.[x]??0;}
function canSee(owner,x,y){return (G.fog[owner-1]?.[y]?.[x]??0)>=2;}

function buildPosMap(){

function posOccupied(x,y){

// RENDER — three-layer separated DOM updates
// Layer 1: fog class (fog/seen/vis)
// Layer 2: sprite innerHTML (only when content changes)
// Layer 3: HP bar width (only when HP changes)
// ════════════════════════════════════
let CE={}; // "x,y" -> {el, ci, hpb, hpf}
// Per-cell cache — separate keys for each layer
let fogCache={};  // "x,y" -> fog value 0/1/2
let sprCache={};  // "x,y" -> sprite key string
let hpCache={};   // "x,y" -> "pct:cls" string

let prevBuildKeys=new Set();

function buildDOM(){
  const canvas=el('map-canvas');
  canvas.innerHTML='';
  canvas.style.width=(MW*CS)+'px';
  canvas.style.height=(MH*CS)+'px';
  CE={}; fogCache={}; sprCache={}; hpCache={};
  prevSelKeys=new Set(); prevBuildKeys=new Set();
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    const d=document.createElement('div');
    d.className='cell fog'; d.dataset.x=x; d.dataset.y=y;
    d.style.left=(x*CS)+'px'; d.style.top=(y*CS)+'px';
    const lbl=document.createElement('span');
    lbl.className='clbl'; lbl.textContent=cs(x,y);
    const ci=document.createElement('span');
    ci.style.cssText='position:relative;display:flex;align-items:center;justify-content:center;width:40px;height:40px;';
    const hpb=document.createElement('div');
    hpb.className='hpb'; hpb.style.display='none';
    const hpf=document.createElement('div');
    hpf.className='hpf my';
    hpb.appendChild(hpf);
    d.appendChild(lbl); d.appendChild(ci); d.appendChild(hpb);
    CE[`${x},${y}`]={el:d,ci,hpb,hpf};
    canvas.appendChild(d);
  }
  setupPointer();
}

function render(){
  const myP=G.myP||1;
  // Build lookup maps for this render pass
  const bAt={};
  for(const b of G.bldgs) bAt[`${b.x},${b.y}`]=b;
  const uAt={};
  for(const u of G.units){
    const k=`${u.x},${u.y}`;
    if(!uAt[k]) uAt[k]=[];
    uAt[k].push(u);
  }

  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    const c=CE[`${x},${y}`]; if(!c) continue;
    const k=`${x},${y}`;
    const f=fog1(x,y); // 0|1|2

    // ── Layer 1: fog class ──
    if(fogCache[k]!==f){
      fogCache[k]=f;
      const fc=f===0?'fog':f===1?'seen':'vis';
      // preserve highlight classes
      const hl=c.el.classList.contains('h-sel')?'h-sel':c.el.classList.contains('h-build')?'h-build':'';
      c.el.className='cell '+fc+(hl?' '+hl:'');
    }

    if(f===0){
      // ensure sprite cleared
      if(sprCache[k]!==''){sprCache[k]='';c.ci.innerHTML='';c.hpb.style.display='none';hpCache[k]='';}
      continue;
    }

    // ── Layer 2: sprite ──
    const t=G.map[y]?.[x]??T.E;
    let sprKey=t===T.G?'gold':t===T.W?'tree':t===T.M?'mountain':'';
    let showHp=false, hp=0, mhp=1, isEn=false, multi=false;

    const b=bAt[k];
    if(b&&(f===2||b.owner===myP)){
      sprKey=b.uc?'construct':(b.owner!==myP?'e_'+b.type:b.type);
      hp=b.hp; mhp=b.mhp; isEn=b.owner!==myP; showHp=true;
    }
    const us=uAt[k];
    if(us&&f===2){
      const show=us.find(u=>u.owner===myP)||us[0];
      if(show){
        sprKey=show.owner!==myP?'e_'+show.type:show.type;
        hp=show.hp; mhp=show.mhp; isEn=show.owner!==myP; showHp=true;
      }
      if(us.length>1) multi=true;
    }

    const fullSprKey=sprKey+(multi?'+':'');
    if(sprCache[k]!==fullSprKey){
      sprCache[k]=fullSprKey;
      c.ci.innerHTML=sprKey&&SPC[sprKey]
        ? SPC[sprKey]+(multi?'<div style="position:absolute;top:1px;right:2px;font-size:9px;color:#ffcc44;font-family:monospace">+</div>':'')
        : '';
    }

    // ── Layer 3: HP bar ──
    if(showHp){
      const pct=Math.max(0,Math.round(hp/mhp*100));
      const cls=isEn?'en':pct<30?'lo':'my';
      const hpKey=pct+'|'+cls;
      if(hpCache[k]!==hpKey){
        hpCache[k]=hpKey;
        c.hpb.style.display='block';
        c.hpf.style.width=pct+'%';
        c.hpf.className='hpf '+cls;
      }
    } else if(hpCache[k]!=='none'){
      hpCache[k]='none';
      c.hpb.style.display='none';
    }
  }
  applyHighlights();
}

function applyHighlights(){
  // Re-resolve from live units
  const live=SEL.selUnits.map(u=>G.units.find(v=>v.id===u.id)).filter(Boolean);
  SEL.selUnits=live;
  const selKeys=new Set(live.map(u=>`${u.x},${u.y}`));
  if(SEL.selBldg){
    const lb=G.bldgs.find(b=>b.id===SEL.selBldg.id);
    if(lb){SEL.selBldg=lb; selKeys.add(`${lb.x},${lb.y}`);}
  }
  prevSelKeys.forEach(k=>{if(!selKeys.has(k)) CE[k]?.el.classList.remove('h-sel');});
  selKeys.forEach(k=>{if(!prevSelKeys.has(k)) CE[k]?.el.classList.add('h-sel');});
  prevSelKeys=selKeys;

  const worker=SEL.phase==='build_place'?SEL.selUnits.find(u=>u.type==='worker'):null;
  const buildKeys=new Set();
  if(worker){
    for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){
      const x=worker.x+dx,y=worker.y+dy;
      if(canBuild(x,y)&&fog1(x,y)>0) buildKeys.add(`${x},${y}`);
    }
  }
  prevBuildKeys.forEach(k=>{if(!buildKeys.has(k)) CE[k]?.el.classList.remove('h-build');});
  buildKeys.forEach(k=>{if(!prevBuildKeys.has(k)) CE[k]?.el.classList.add('h-build');});
  prevBuildKeys=buildKeys;
}

// ── Network serialization (compact delta format) ──
// Only send fields that Guest needs: position, hp, action state
// Buildings: id,type,owner,x,y,hp,uc,bp,bt,tq,tp
// Units:     id,type,owner,x,y,hp,act,tgt
const BF=['id','type','owner','x','y','hp','uc','bp','bt','tq','tp'];
const UF=['id','type','owner','x','y','hp','act','tgt'];
function packB(b){return BF.map(f=>b[f]);}
function packU(u){return UF.map(f=>u[f]);}
function unpackB(a){const o={};BF.forEach((f,i)=>{o[f]=a[i];});o.mhp=BD[o.type]?.hp||100;return o;}
function unpackU(a){const o={};UF.forEach((f,i)=>{o[f]=a[i];});
  const d=UD[o.type]||{}; o.mhp=d.hp||50; o.atk=d.atk||1; o.def=d.def||0; o.rng=d.rng||1; o.vis=d.vis||2; o.food=d.food||0;
  return o;}

// Fog compression: encode as base64-like run-length
function packFog(fogArr){
  const out=[];
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++) out.push(fogArr[y][x]);
  return out;
}
function unpackFog(arr){
  const fog=[];
  for(let y=0;y<MH;y++){fog.push(new Uint8Array(MW)); for(let x=0;x<MW;x++) fog[y][x]=arr[y*MW+x];}
  return fog;
}

let hostMapSent=false;
function sendToGuest(){
  const payload={
    t:'s', seq:++netSeq,
    k:G.tick, o:G.over, w:G.winner,
    r:G.res,
    f:packFog(G.fog[1]),  // P2 fog only
    b:G.bldgs.map(packB),
    u:G.units.map(packU),
  };
  if(!hostMapSent){payload.m=G.map; hostMapSent=true;}
  sendRaw(payload);
}

let lastSeq=0;
function onPeerMsg(msg){
  if(gameMode==='host'&&msg.t==='cmd'){P2cmdQueue.push(msg.cmd);return;}
  if(msg.t==='s'){
    // Drop out-of-order packets
    if(msg.seq<=lastSeq) return;
    lastSeq=msg.seq;

    if(msg.m) G.map=msg.m;
    G.fog=[[],unpackFog(msg.f)]; // index 1 = P2 fog
    G.tick=msg.k; G.over=msg.o; G.winner=msg.w;
    G.res=msg.r;
    G.bldgs=msg.b.map(unpackB);
    G.units=msg.u.map(unpackU);
    G.myP=2;

    el('h-tick').textContent='T'+G.tick;
    updateHUD(); render();
    if(G.over) showWin();
  }
}

function sendCmd(cmd){if(gameMode==='guest') sendRaw({t:'cmd',cmd});}

function applyCmd(cmd,owner){
  if(cmd.act==='move'){
    const us=G.units.filter(u=>cmd.ids.includes(u.id)&&u.owner===owner);
    assignSpreadMove(us,cmd.tx,cmd.ty);
  } else if(cmd.act==='attack'){
    G.units.filter(u=>cmd.ids.includes(u.id)&&u.owner===owner).forEach(u=>{u.act='attack';u.tgt=cmd.tgt;});
  } else if(cmd.act==='harvest'){
    G.units.filter(u=>cmd.ids.includes(u.id)&&u.owner===owner).forEach(u=>{u.act='harvest';u.tgt=[cmd.tx,cmd.ty];});
  } else if(cmd.act==='repair'){
    G.units.filter(u=>cmd.ids.includes(u.id)&&u.owner===owner).forEach(u=>{u.act='repair';u.tgt=cmd.tgt;});
  } else if(cmd.act==='build'){
    const d=BD[cmd.btype],p=G.res[owner];
    if(p.gold>=d.cost.g&&p.wood>=d.cost.w&&canBuild(cmd.tx,cmd.ty)){
      p.gold-=d.cost.g; p.wood-=d.cost.w;
      addBldg(cmd.btype,owner,cmd.tx,cmd.ty,true);
      const w=G.units.find(u=>cmd.ids.includes(u.id)&&u.type==='worker');
      if(w){w.act='move';w.tgt=[cmd.tx,cmd.ty];}
    }
  } else if(cmd.act==='train'){
    const b=G.bldgs.find(b=>b.id===cmd.bid&&b.owner===owner);
    if(!b) return;
    const p=G.res[owner],cost=UD[cmd.utype].cost.g;
    if(p.gold>=cost&&(cmd.utype==='worker'||p.food<p.foodMax)){p.gold-=cost;b.tq.push(cmd.utype);}
  }
}

function startSolo(){gameMode='solo'; initGame(1);}
function startHost(){gameMode='host'; initGame(1); hostMapSent=false; netSeq=0;
  clearInterval(tickTmr);
  tickTmr=setInterval(()=>{

    P2cmdQueue.splice(0).forEach(cmd=>applyCmd(cmd,2));
    tick(); sendToGuest();

function startGuest(){

function initGame(myP){
  clearInterval(tickTmr);
  G=newG(myP);

  buildMap(); buildTileIndex(); placeStart();
  fogRevealers={1:[],2:[]};

  }
}

function buildMap(){
  G.map=[];
  for(let y=0;y<MH;y++){G.map.push([]); for(let x=0;x<MW;x++) G.map[y].push(T.E);}
  initFog();
  [[5,5],[6,5],[5,6],[7,8],[8,8],[16,11],[17,11],[16,12],[11,9],[12,9],[11,10]].forEach(([x,y])=>setTile(x,y,T.M));
  [[3,2],[4,3],[3,4],[17,15],[18,16],[17,14],[8,3],[9,4],[14,14],[15,15],[6,9],[7,10],[13,8],[14,9],[10,3],[11,4],[13,16],[14,17]].forEach(([x,y])=>setTile(x,y,T.W));
  [[2,2],[20,2],[2,17],[20,17],[11,7],[11,13]].forEach(([x,y])=>setTile(x,y,T.G));
}
function setTile(x,y,t){if(inB(x,y))G.map[y][x]=t;}

function placeStart(){
  addBldg('townhall',1,1,9); addBldg('townhall',2,22,10);
  addUnit('worker',1,2,9); addUnit('worker',1,1,10);
  addUnit('worker',2,21,10); addUnit('worker',2,22,9);
}

function addBldg(type,owner,x,y,uc=false){
  const d=BD[type];
  const id='b'+G.bc++;
  G.bldgs.push({id,type,owner,x,y,hp:d.hp,mhp:d.hp,uc,bp:uc?0:d.bt,bt:d.bt,tq:[],tp:0});
  if(d.food&&!uc) G.res[owner].foodMax+=d.food;
  return id;
}

function addUnit(type,owner,x,y){
  const d=UD[type];
  const pk=type[0];
  G.uc[owner][pk]++;
  const id=pk+G.uc[owner][pk]+'p'+owner;
  G.units.push({id,type,owner,x,y,hp:d.hp,mhp:d.hp,atk:d.atk,def:d.def||0,rng:d.rng,vis:d.vis,food:d.food,act:null,tgt:null});
  G.res[owner].food+=d.food;
  return id;
}

// ════════════════════════════════════
// TICK
// ════════════════════════════════════
function tick(){
  if(G.over) return;
  G.tick++;
  el('h-tick').textContent='T'+G.tick;

  buildPosMap(); // O(N) once per tick, enables O(1) lookups below
  const dead=new Set();

  G.units.forEach(u=>{
    if(u.act==='move'&&u.tgt){
      const [tx,ty]=u.tgt;
      if(u.x===tx&&u.y===ty){u.act=null;u.tgt=null;return;}
      const s=step(u.x,u.y,tx,ty,u.id);
      if(s){
        delete posMap[`${u.x},${u.y}`];
        u.x=s[0];u.y=s[1];
        posMap[`${u.x},${u.y}`]=u;
      } else {u.act=null;u.tgt=null;}
    }
    else if(u.act==='harvest'&&u.tgt){
      const [tx,ty]=u.tgt;
      const dist=Math.abs(u.x-tx)+Math.abs(u.y-ty);
      if(dist<=1){
        const t=G.map[ty]?.[tx];
        if(t===T.G) G.res[u.owner].gold+=4;
        else if(t===T.W) G.res[u.owner].wood+=3;
      } else {
        const s=step(u.x,u.y,tx,ty,u.id);
        if(s){delete posMap[`${u.x},${u.y}`];u.x=s[0];u.y=s[1];posMap[`${u.x},${u.y}`]=u;}
        else{u.act=null;u.tgt=null;}
      }
    }
    else if(u.act==='repair'&&u.tgt){
      const bldg=G.bldgs.find(b=>b.id===u.tgt);
      if(!bldg||bldg.hp>=bldg.mhp){u.act=null;u.tgt=null;return;}
      if(Math.abs(u.x-bldg.x)+Math.abs(u.y-bldg.y)<=1){
        if(G.res[u.owner].gold>0){
          G.res[u.owner].gold--;
          bldg.hp=Math.min(bldg.mhp,bldg.hp+3);
          if(bldg.hp>=bldg.mhp){glog('✅ '+bldg.type+' 修復完成');u.act=null;u.tgt=null;}
        }
      } else {
        const s=step(u.x,u.y,bldg.x,bldg.y,u.id);
        if(s){delete posMap[`${u.x},${u.y}`];u.x=s[0];u.y=s[1];posMap[`${u.x},${u.y}`]=u;}
        else{u.act=null;u.tgt=null;}
      }
    }
    else if(u.act==='attack'&&u.tgt){
      const tgt=byId(u.tgt);
      if(!tgt){u.act=null;u.tgt=null;return;}
      const dist=Math.abs(u.x-tgt.x)+Math.abs(u.y-tgt.y);
      if(dist<=u.rng){
        const dmg=Math.max(1,u.atk-(tgt.def||0));
        tgt.hp-=dmg;
        if(G.tick%3===0) hitFx(tgt.x,tgt.y);
        if(tgt.hp<=0) dead.add(tgt.id);
      } else {
        const s=step(u.x,u.y,tgt.x,tgt.y,u.id);
        if(s){delete posMap[`${u.x},${u.y}`];u.x=s[0];u.y=s[1];posMap[`${u.x},${u.y}`]=u;}
      }
    }
    else if(!u.act&&(u.type==='soldier'||u.type==='archer')){
      // Auto-attack: only enemies in vision range
      const enemy=3-u.owner;
      let nearest=null,nearestD=999;
      for(const e of [...G.units.filter(v=>v.owner===enemy),...G.bldgs.filter(v=>v.owner===enemy)]){
        if(!canSee(u.owner,e.x,e.y)) continue;
        const d=Math.abs(u.x-e.x)+Math.abs(u.y-e.y);
        if(d<nearestD){nearestD=d;nearest=e;}
      }
      if(nearest){u.act='attack';u.tgt=nearest.id;}
    }
  });

  // Tower auto-attack
  for(const tw of G.bldgs.filter(b=>b.type==='tower'&&!b.uc)){
    for(const u of G.units){
      if(u.owner===tw.owner) continue;
      if(Math.abs(u.x-tw.x)+Math.abs(u.y-tw.y)>BD.tower.rng) continue;
      if(!canSee(tw.owner,u.x,u.y)) continue;
      const dmg=Math.max(1,BD.tower.atk-(u.def||0));
      u.hp-=dmg; hitFx(u.x,u.y);
      if(u.hp<=0) dead.add(u.id);
      break; // one target per tower per tick
    }
  }

  // Kill dead
  dead.forEach(id=>{
    const ui=G.units.findIndex(u=>u.id===id);
    if(ui!==-1){
      const u=G.units[ui];
      G.res[u.owner].food-=u.food;
      delete posMap[`${u.x},${u.y}`];
      glog('💀 '+dsp(u)+' 陣亡');
      G.units.splice(ui,1);
      SEL.selUnits=SEL.selUnits.filter(v=>v.id!==id);
    }
    const bi=G.bldgs.findIndex(b=>b.id===id);
    if(bi!==-1){
      const b=G.bldgs[bi];
      if(b.type==='townhall'){G.over=true;G.winner=b.owner===1?2:1;showWin();}
      if(b.type==='farm'&&!b.uc) G.res[b.owner].foodMax-=BD.farm.food;
      glog('💥 '+dsp(b)+' 被摧毀');
      G.bldgs.splice(bi,1);
      if(SEL.selBldg?.id===id) resetSel();
    }
  });

  // Building progress
  for(const b of G.bldgs){
    if(b.uc&&b.bp<b.bt){
      b.bp++;
      if(b.bp>=b.bt){
        b.uc=false;
        glog('✅ '+b.type+' 建造完成 ('+cs(b.x,b.y)+')');
        if(BD[b.type].food) G.res[b.owner].foodMax+=BD[b.type].food;
        if(SEL.selBldg?.id===b.id) showBldgPanel(b);
      }
    }
    if(!b.uc&&b.tq.length>0){
      b.tp++;
      const need=b.tq[0]==='worker'?12:b.tq[0]==='soldier'?10:14;
      if(b.tp>=need){
        const ut=b.tq.shift(); b.tp=0;
        const pos=nearEmpty(b.x,b.y);
        if(pos){addUnit(ut,b.owner,pos[0],pos[1]); glog('🎖️ '+ut+' 訓練完成');}
        if(SEL.selBldg?.id===b.id) showBldgPanel(b);
      }
    } else if(!b.uc&&b.tq.length===0) b.tp=0;
  }

  updateFog(); updateHUD(); render();
}

// ════════════════════════════════════
// PATHFINDING — O(1) collision check via posMap
// ════════════════════════════════════
function canWalk(x,y){
  if(!inB(x,y)) return false;
  const t=G.map[y][x];
  if(t===T.M||t===T.G||t===T.W) return false;
  if(G.bldgs.find(b=>b.x===x&&b.y===y)) return false;
  return true;
}
function canBuild(x,y){
  if(!inB(x,y)||G.map[y][x]!==T.E) return false;
  return !G.bldgs.find(b=>b.x===x&&b.y===y);
}
function step(fx,fy,tx,ty,selfId){
  const dx=tx-fx,dy=ty-fy;
  if(!dx&&!dy) return null;
  const sx=dx>0?1:dx<0?-1:0, sy=dy>0?1:dy<0?-1:0;
  const cands=Math.abs(dx)>=Math.abs(dy)
    ?[[fx+sx,fy],[fx,fy+sy],[fx+sx,fy+sy]]
    :[[fx,fy+sy],[fx+sx,fy],[fx+sx,fy+sy]];
  for(const [nx,ny] of cands){
    if(!canWalk(nx,ny)) continue;
    if(posMap[`${nx},${ny}`]&&posMap[`${nx},${ny}`].id!==selfId) continue; // O(1) lookup
    return [nx,ny];
  }
  return null;
}
function nearestTile(cx,cy,tiles){
  let best=null,bd=999;
  for(const [x,y] of tiles){const d=Math.abs(x-cx)+Math.abs(y-cy);if(d<bd){bd=d;best=[x,y];}}
  return best;
}
function nearEmpty(cx,cy,r=4){
  for(let rd=1;rd<=r;rd++) for(let dy=-rd;dy<=rd;dy++) for(let dx=-rd;dx<=rd;dx++){
    const x=cx+dx,y=cy+dy;
    if(canBuild(x,y)&&!posMap[`${x},${y}`]) return [x,y];
  }
  return null;
}
function assignSpreadMove(units,cx,cy){
  const cands=[];
  for(let r=0;r<=4;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
    if(Math.max(Math.abs(dx),Math.abs(dy))!==r) continue;
    const nx=cx+dx,ny=cy+dy;
    if(canWalk(nx,ny)) cands.push([nx,ny,Math.abs(dx)+Math.abs(dy)]);
  }
  cands.sort((a,b)=>a[2]-b[2]);
  const sorted=[...units].sort((a,b)=>(Math.abs(a.x-cx)+Math.abs(a.y-cy))-(Math.abs(b.x-cx)+Math.abs(b.y-cy)));
  const used=new Set(G.units.filter(u=>!units.find(v=>v.id===u.id)).map(u=>`${u.x},${u.y}`));
  sorted.forEach(u=>{
    const spot=cands.find(([nx,ny])=>!used.has(`${nx},${ny}`));
    if(spot){used.add(`${spot[0]},${spot[1]}`);u.act='move';u.tgt=[spot[0],spot[1]];}
    else{u.act=null;u.tgt=null;}
  });
}

// ════════════════════════════════════
// SELECTION STATE
// ════════════════════════════════════
let SEL={phase:'idle',selUnits:[],selBldg:null,buildType:null,boxMode:false};

function resetSel(){
  prevSelKeys.forEach(k=>CE[k]?.el.classList.remove('h-sel'));
  prevBuildKeys.forEach(k=>CE[k]?.el.classList.remove('h-build'));
  prevSelKeys=new Set(); prevBuildKeys=new Set();
  SEL={phase:'idle',selUnits:[],selBldg:null,buildType:null,boxMode:false};
  setBoxMode(false);
  setInfo('🗺️','點選單位或建築','','');
  setActions('<span class="hint">點我方👷Worker或⚔️士兵開始<br>按 ⬚框選 可拖曳框選多個單位</span>');
  render();
}

// ════════════════════════════════════
// POINTER HANDLING
// ════════════════════════════════════
let PT={down:false,startX:0,startY:0,startScrX:0,startScrY:0,moved:false,dragging:false,mode:null};

function setupPointer(){
  const wrap=el('map-wrap');
  wrap.addEventListener('touchstart',onTS,{passive:false});
  wrap.addEventListener('touchmove', onTM,{passive:false});
  wrap.addEventListener('touchend',  onTE,{passive:false});
  wrap.addEventListener('mousedown', onMD);
  wrap.addEventListener('mousemove', onMM);
  wrap.addEventListener('mouseup',   onMU);
}
function cellAt(cx,cy){
  const wrap=el('map-wrap'),r=wrap.getBoundingClientRect();
  const gx=Math.floor((cx-r.left+wrap.scrollLeft)/CS);
  const gy=Math.floor((cy-r.top+wrap.scrollTop)/CS);
  return inB(gx,gy)?{x:gx,y:gy}:null;
}
function ptStart(cx,cy){
  const wrap=el('map-wrap');
  PT.down=true;PT.moved=false;PT.dragging=false;PT.mode=null;
  PT.startX=cx;PT.startY=cy;PT.startScrX=wrap.scrollLeft;PT.startScrY=wrap.scrollTop;
}
function ptMove(cx,cy){
  if(!PT.down) return;
  const dx=cx-PT.startX,dy=cy-PT.startY;
  if(Math.abs(dx)<10&&Math.abs(dy)<10) return;
  PT.moved=true;
  if(!PT.mode) PT.mode=SEL.boxMode?'drag':'scroll';
  if(PT.mode==='drag'){PT.dragging=true;updateDragBox(cx,cy);}
  else{const w=el('map-wrap');w.scrollLeft=PT.startScrX-dx;w.scrollTop=PT.startScrY-dy;}
}
function ptEnd(cx,cy){
  if(!PT.down) return; PT.down=false;
  el('dragbox').style.display='none';
  if(PT.dragging) finalizeDrag(cx,cy);
  else if(!PT.moved){const c=cellAt(cx,cy);if(c) onTap(c.x,c.y);}
  PT.dragging=false;PT.mode=null;
}
function onTS(e){if(e.touches.length>1){PT.down=false;return;}e.preventDefault();const t=e.touches[0];ptStart(t.clientX,t.clientY);}
function onTM(e){if(!PT.down)return;e.preventDefault();const t=e.touches[0];ptMove(t.clientX,t.clientY);}
function onTE(e){if(!PT.down)return;const t=e.changedTouches[0];ptEnd(t.clientX,t.clientY);}
function onMD(e){if(e.button!==0)return;ptStart(e.clientX,e.clientY);}
function onMM(e){ptMove(e.clientX,e.clientY);}
function onMU(e){ptEnd(e.clientX,e.clientY);}

function updateDragBox(cx,cy){
  const db=el('dragbox'),wrap=el('map-wrap'),r=wrap.getBoundingClientRect();
  const ax=Math.min(PT.startX,cx)-r.left+wrap.scrollLeft;
  const ay=Math.min(PT.startY,cy)-r.top+wrap.scrollTop;
  const bx=Math.max(PT.startX,cx)-r.left+wrap.scrollLeft;
  const by=Math.max(PT.startY,cy)-r.top+wrap.scrollTop;
  db.style.display='block';db.style.left=ax+'px';db.style.top=ay+'px';
  db.style.width=(bx-ax)+'px';db.style.height=(by-ay)+'px';
}
function finalizeDrag(ex,ey){
  const wrap=el('map-wrap'),r=wrap.getBoundingClientRect();
  const ax=Math.min(PT.startX,ex)-r.left+wrap.scrollLeft;
  const ay=Math.min(PT.startY,ey)-r.top+wrap.scrollTop;
  const bx=Math.max(PT.startX,ex)-r.left+wrap.scrollLeft;
  const by=Math.max(PT.startY,ey)-r.top+wrap.scrollTop;
  const gx0=Math.floor(ax/CS),gy0=Math.floor(ay/CS),gx1=Math.floor(bx/CS),gy1=Math.floor(by/CS);
  const myP=G.myP||1;
  const sel=G.units.filter(u=>u.owner===myP&&u.x>=gx0&&u.x<=gx1&&u.y>=gy0&&u.y<=gy1);
  setBoxMode(false);
  if(sel.length>0){SEL.phase='sel';SEL.selUnits=sel;SEL.selBldg=null;showMultiPanel(sel);}
  else resetSel();
  render();
}

// ════════════════════════════════════
// TAP LOGIC
// ════════════════════════════════════
function onTap(x,y){
  if(!G.map||!G.map[y]) return;
  const myP=G.myP||1;
  const f=fog1(x,y);
  const terrain=G.map[y][x];
  const myBldg=G.bldgs.find(b=>b.x===x&&b.y===y&&b.owner===myP);
  const myUnit=G.units.find(u=>u.x===x&&u.y===y&&u.owner===myP);
  const enBldg=f===2?G.bldgs.find(b=>b.x===x&&b.y===y&&b.owner!==myP):null;
  const enUnit=f===2?G.units.find(u=>u.x===x&&u.y===y&&u.owner!==myP):null;

  // Build placement phase
  if(SEL.phase==='build_place'){
    if(canBuild(x,y)){
      const worker=SEL.selUnits.find(u=>u.type==='worker');
      if(worker&&Math.abs(x-worker.x)<=2&&Math.abs(y-worker.y)<=2){
        execBuild(x,y);
      } else glog('❌ 超出建造範圍（Worker 5×5 格內）');
    } else glog('❌ 無法在此建造');
    const w=SEL.selUnits.find(u=>u.type==='worker');
    if(w){SEL.phase='sel';SEL.buildType=null;showUnitPanel(w);render();}
    else resetSel();
    return;
  }

  if(SEL.selUnits.length>0){
    const units=SEL.selUnits;
    // Own unit → switch selection
    if(myUnit){selectUnit(myUnit);return;}
    if(myBldg){selectBldg(myBldg);return;}
    // Enemy → attack
    if(enUnit||enBldg){
      const tgt=enUnit||enBldg;
      doAttack(units,tgt.id);
      glog('⚔️ '+units.length+'個單位攻擊 '+dsp(tgt));
      refreshSelPanel(); return;
    }
    // Damaged own building with workers → repair
    if(myBldg&&myBldg.hp<myBldg.mhp){
      const wks=units.filter(u=>u.type==='worker');
      if(wks.length>0){doRepair(wks,myBldg.id);glog('🔧 修復 '+myBldg.type);refreshSelPanel();return;}
    }
    // Resource → harvest
    if(terrain===T.G||terrain===T.W){
      const wks=units.filter(u=>u.type==='worker');
      if(wks.length>0){doHarvest(wks,x,y);glog('⛏️ 採集 '+(terrain===T.G?'💰':'🌲'));refreshSelPanel();return;}
    }
    // Walkable → move
    if(canWalk(x,y)){doMove(units,x,y);glog('🚶 '+units.length+'個單位→'+cs(x,y));refreshSelPanel();return;}
    resetSel(); return;
  }

  // Nothing selected
  if(myUnit){selectUnit(myUnit);return;}
  if(myBldg){selectBldg(myBldg);return;}
  if(enUnit||enBldg){
    const e=enUnit||enBldg;
    setInfo('👁️','敵方 '+(IC['e_'+e.type]||e.type),'HP '+e.hp+'/'+e.mhp,'');
    setActions('<span class="hint">先選我方士兵，再點此敵人攻擊</span>');return;
  }
  if(terrain===T.G){setInfo('💎','金礦','可採集','');setActions('<span class="hint">先選👷Worker，再點此採集</span>');return;}
  if(terrain===T.W){setInfo('🌳','樹林','可砍伐','');setActions('<span class="hint">先選👷Worker，再點此採集</span>');return;}
  if(terrain===T.M){setInfo('⛰️','山地','不可通行','');setActions('');return;}
  resetSel();
}

// ════════════════════════════════════
// ACTIONS (multiplayer-aware)
// ════════════════════════════════════
function doMove(units,tx,ty){
  if(gameMode==='guest') sendCmd({act:'move',ids:units.map(u=>u.id),tx,ty});
  assignSpreadMove(units,tx,ty);
}
function doAttack(units,tgtId){
  if(gameMode==='guest') sendCmd({act:'attack',ids:units.map(u=>u.id),tgt:tgtId});
  units.forEach(u=>{u.act='attack';u.tgt=tgtId;});
}
function doHarvest(units,tx,ty){
  if(gameMode==='guest') sendCmd({act:'harvest',ids:units.map(u=>u.id),tx,ty});
  units.forEach(u=>{u.act='harvest';u.tgt=[tx,ty];});
}
function doRepair(units,bldgId){
  if(gameMode==='guest') sendCmd({act:'repair',ids:units.map(u=>u.id),tgt:bldgId});
  units.forEach(u=>{u.act='repair';u.tgt=bldgId;});
}
function execBuild(x,y){
  const type=SEL.buildType;
  const d=BD[type],p=G.res[G.myP||1];
  if(p.gold<d.cost.g||p.wood<d.cost.w){glog('❌ 資源不足');return;}
  const worker=SEL.selUnits.find(u=>u.type==='worker');
  if(!worker) return;
  if(gameMode==='guest'){
    sendCmd({act:'build',ids:[worker.id],btype:type,tx:x,ty:y});
    p.gold-=d.cost.g;p.wood-=d.cost.w;
  } else {
    p.gold-=d.cost.g;p.wood-=d.cost.w;
    addBldg(type,G.myP||1,x,y,true);
  }
  worker.act='move';worker.tgt=[x,y];
  glog('🏗️ 建造 '+type+' → '+cs(x,y));
  updateHUD();
}
function doTrain(bldgId,utype){
  const b=G.bldgs.find(b=>b.id===bldgId);if(!b)return;
  const p=G.res[G.myP||1],cost=UD[utype].cost.g;
  if(p.gold<cost){glog('❌ 金幣不足');return;}
  if(utype!=='worker'&&p.food>=p.foodMax){glog('❌ 食物已滿');return;}
  if(gameMode==='guest') sendCmd({act:'train',bid:bldgId,utype});
  p.gold-=cost; b.tq.push(utype);
  glog('✅ '+utype+' 加入訓練');
  updateHUD(); showBldgPanel(b);
}

// ════════════════════════════════════
// PANELS
// ════════════════════════════════════
function selectUnit(u){
  SEL.phase='sel';SEL.selUnits=[u];SEL.selBldg=null;
  const myP=G.myP||1;
  const lbl=u.owner!==myP?(IC['e_'+u.type]||'敵單位'):(IC[u.type]||u.type);
  setInfo('⚔️',lbl,'HP '+u.hp+'/'+u.mhp+'  DEF '+(u.def||0),stateStr(u));
  showUnitPanel(u);render();
}
function selectBldg(b){
  SEL.phase='sel';SEL.selUnits=[];SEL.selBldg=b;
  const myP=G.myP||1;
  const lbl=b.owner!==myP?(IC['e_'+b.type]||'敵建築'):(IC[b.type]||b.type);
  setInfo('🏛️',lbl+(b.uc?' (建造中)':''),'HP '+b.hp+'/'+b.mhp,b.tq?.length?'隊列:'+b.tq.length:'');
  showBldgPanel(b);render();
}
function showUnitPanel(u){
  const p=G.res[G.myP||1];let html='';
  if(u.type==='worker'){
    html+='<span class="hint">點地圖移動・點💰🌲採集・點受損建築修復・點敵人攻擊</span>';
    html+=ab('🌾 建農場','60🪙30🌲',p.gold>=60&&p.wood>=30,"startBuild('farm')");
    html+=ab('⚔️ 建兵營','120🪙50🌲',p.gold>=120&&p.wood>=50,"startBuild('barracks')");
    html+=ab('🗼 建箭塔','150🪙100🌲',p.gold>=150&&p.wood>=100,"startBuild('tower')");
  } else {
    html+='<span class="hint">點地圖移動・點敵人/建築攻擊</span>';
  }
  html+='<button class="ab" onclick="resetSel()">取消選擇</button>';
  setInfo('⚔️',IC[u.type]||u.type,'HP '+u.hp+'/'+u.mhp+'  DEF '+(u.def||0),stateStr(u));
  setActions(html);
}
function showBldgPanel(b){
  if(b.uc){setActions('<span class="hint">建造中 '+b.bp+'/'+b.bt+' ticks</span><button class="ab" onclick="resetSel()">關閉</button>');return;}
  const p=G.res[G.myP||1];let html='';
  if(b.type==='townhall') html+=ab('👷 訓練Worker','50🪙',p.gold>=50,"doTrain('"+b.id+"','worker')");
  if(b.type==='barracks'){
    const hf=p.food<p.foodMax;
    html+=ab('🗡️ 士兵','90🪙',p.gold>=90&&hf,"doTrain('"+b.id+"','soldier')");
    html+=ab('🏹 弓手','100🪙',p.gold>=100&&hf,"doTrain('"+b.id+"','archer')");
    if(!hf) html+='<span class="hint" style="color:var(--r)">⚠️ 食物已滿，請先建農場</span>';
    if(b.tq.length) html+='<span class="hint">訓練隊列: '+b.tq.join(',')+'('+b.tp+'t)</span>';
  }
  if(b.type==='farm') html+='<span class="hint">提供 +5 食物上限</span>';
  if(b.type==='tower') html+='<span class="hint">自動攻擊 '+BD.tower.rng+' 格內敵人 (ATK '+BD.tower.atk+')</span>';
  html+='<button class="ab" onclick="resetSel()">關閉</button>';
  setActions(html);
}
function showMultiPanel(units){
  const t=[...new Set(units.map(u=>u.type))].join('+');
  setInfo('⚔️',units.length+'個單位 ('+t+')','點地圖移動・點敵人攻擊','');
  setActions('<span class="hint">點空地移動・點敵人攻擊</span><button class="ab" onclick="resetSel()">取消</button>');
  render();
}
function refreshSelPanel(){
  if(SEL.selUnits.length===1) selectUnit(SEL.selUnits[0]);
  else if(SEL.selUnits.length>1) showMultiPanel(SEL.selUnits);
  else if(SEL.selBldg) selectBldg(SEL.selBldg);
  render();
}
function startBuild(type){
  SEL.buildType=type;SEL.phase='build_place';
  setInfo('🏗️','選擇建造位置','點綠色高亮的空地','');
  setActions('<span class="hint">點空地 (綠框) 放置 '+type+'</span><button class="ab" onclick="resetSel()">取消</button>');
  render();
}

// ════════════════════════════════════
// UI HELPERS
// ════════════════════════════════════
function el(id){return document.getElementById(id);}
function inB(x,y){return x>=0&&x<MW&&y>=0&&y<MH;}
function cs(x,y){return String.fromCharCode(65+x)+(y+1);}
function dsp(e){return(e.owner===2?'敵':'')+e.id.replace(/p\d$/,'');}
function byId(id){return G.units.find(u=>u.id===id)||G.bldgs.find(b=>b.id===id);}
function stateStr(u){
  if(!u.act) return '待機';
  if(u.act==='move') return '移動→'+(u.tgt?cs(u.tgt[0],u.tgt[1]):'');
  if(u.act==='harvest') return '採集中';
  if(u.act==='attack') return '攻擊中';
  if(u.act==='repair') return '修復中';
  return u.act;
}
function ab(label,cost,ok,cb){
  return '<button class="ab'+(ok?'':' off')+'" '+(ok?'onclick="'+cb+'"':'')+'>'+label+'<span class="co">'+cost+'</span></button>';
}
function setInfo(icon,name,hp,state){
  el('i-icon').textContent=icon;el('i-name').textContent=name;
  el('i-hp').textContent=hp;el('i-state').textContent=state;
}
function setActions(html){el('action-bar').innerHTML=html;}
function glog(msg){el('logbar').textContent=msg;}
function updateHUD(){
  const p=G.res[G.myP||1];
  el('h-gold').textContent=p.gold;el('h-wood').textContent=p.wood;
  el('h-food').textContent=p.food;el('h-fmax').textContent=p.foodMax;
}
function hitFx(x,y){
  const c=CE[`${x},${y}`];if(!c)return;
  c.el.classList.add('hit-fx');
  setTimeout(()=>c.el.classList.remove('hit-fx'),360);
}
function setBoxMode(on){
  SEL.boxMode=on;
  const btn=el('box-btn');if(!btn)return;
  if(on){btn.textContent='✕ 取消框選';btn.style.borderColor='var(--y)';btn.style.color='var(--y)';}
  else{btn.textContent='⬚ 框選';btn.style.borderColor='';btn.style.color='';}
}
function toggleBoxMode(){setBoxMode(!SEL.boxMode);}
function cycleSpeed(){
  speedLv=speedLv===1?2:speedLv===2?4:1;
  el('speed-btn').textContent=speedLv+'x';
  clearInterval(tickTmr);
  tickTmr=setInterval(()=>{tick();if(G.over)clearInterval(tickTmr);},Math.round(TICK_MS/speedLv));
}
function showWin(){
  clearInterval(tickTmr);
  const iWin=G.winner===(G.myP||1);
  el('win-txt').textContent=iWin?'🏆 勝利！':'💀 敗北...';
  el('win-sub').textContent='Tick '+G.tick+' — '+(iWin?'摧毀敵方主城！':'主城被摧毀...');
  el('win-ovl').classList.add('show');
}
function goMenu(){
  clearInterval(tickTmr);
  cleanupRTC();
  el('game').style.display='none';
  el('win-ovl').classList.remove('show');
  el('speed-btn').style.display='';
  el('menu').style.display='flex';
  resetSel();
}
</script>
